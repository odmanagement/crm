<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinPro Agreement Generator</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 20px; background:#eee; color:#000; }
  .toolbar { max-width: 780px; margin: 0 auto 16px; display:flex; gap:8px; flex-wrap:wrap; }
  .toolbar button { padding:8px 16px; border:none; border-radius:5px; background:#2c6fbb; color:#fff; cursor:pointer; font-size:13px; }
  .toolbar button.sec { background:#666; }
  .page { width: 210mm; min-height: 297mm; margin: 0 auto; background:#fff; padding: 18mm 16mm; box-shadow:0 1px 6px rgba(0,0,0,.2); text-transform:uppercase; }
  input { font-family: inherit; font-size: inherit; border: none; border-bottom: 1px dashed #bbb; background: transparent; padding: 1px 3px; text-transform:uppercase; }
  input:focus { outline: none; border-bottom: 1px solid #2c6fbb; background:#f4f9ff; }
  input.num { text-align: right; }
  .title { text-align:center; font-weight:bold; border:1px solid #000; padding:12px; font-size:20px; }
  .title input { text-align:center; font-weight:bold; width:90%; font-size:20px; }
  table { width:100%; border-collapse:collapse; margin-top:14px; }
  td { padding:3px 4px; font-size:13px; vertical-align:middle; }
  .hdr td { padding:3px 4px; }
  .colon { width:14px; text-align:center; }
  .lbl { font-weight:bold; }
  .blue { color:#2c6fbb; font-weight:bold; }
  .blue input { color:#2c6fbb; font-weight:bold; }
  .sec-head { background:#fce9c8; font-weight:bold; border:1px solid #000; padding:4px 6px; font-size:13px; margin-top:6px; }
  input.num, .totrow .tamt, .pamt { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  .row { display:flex; align-items:center; padding:2px 0; font-size:13px; }
  .row .name { flex:1; }
  .row .name input { width:200px; }
  .row .amt { width:150px; text-align:right; padding-right:12px; }
  .row .amt input { width:108px; text-align:right; padding-right:0; }
  .total-line { border-top:1px solid #000; border-bottom:3px double #000; }
  .totrow { display:flex; align-items:center; font-size:13px; padding:3px 0; }
  .totrow .tlbl { flex:1; text-align:right; font-weight:bold; padding-right:12px; }
  .totrow .tamt { width:150px; text-align:right; font-weight:bold; border-top:1px solid #000; border-bottom:3px double #000; padding-right:12px; margin-right:22px; }
  .additem { font-size:12px; color:#2c6fbb; cursor:pointer; background:none; border:none; padding:2px 0; }
  .pamt { width:150px; text-align:right; padding-right:12px; margin-right:22px; font-weight:bold; }
  .pamt.underline { border-bottom:1px solid #000; }
  .pamt.dblunderline { border-bottom:3px double #000; }
  .chkbox { display:inline-block; width:22px; height:16px; border:1px solid #000; vertical-align:middle; text-align:center; line-height:14px; font-weight:bold; font-size:14px; cursor:pointer; }
  .del { color:#c00; cursor:pointer; border:none; background:none; font-size:14px; padding:0; width:22px; flex:0 0 22px; text-align:center; }
  @media print {
    body { background:#fff; padding:0; margin:0; }
    .toolbar { display:none; }
    .page { box-shadow:none; width:100%; min-height:auto; padding:0; }
    .additem, .noprint { display:none; }
    .del { visibility:hidden; }
    input { border-bottom:none !important; }
    @page { size:A4; margin:14mm; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <button onclick="window.print()">Save as PDF / Print</button>
  <button onclick="saveArchive()">💾 存档</button>
  <button onclick="loadArchive()">📂 读取存档</button>
  <button onclick="copyNotice()">📋 Copy 通知</button>
  <button onclick="funderCopy()">💰 FUNDER COPY</button>
  <button onclick="settlementCopy()">🧾 SETTLEMENT COPY</button>
  <button class="sec" onclick="location.reload()">Reset</button>
</div>

<div class="page">
  <div class="title"><input id="hdr" value=""></div>

  <table class="hdr">
    <tr><td class="lbl" style="width:40%">NAME:</td><td class="colon">:</td><td><input id="name" value="" style="width:220px"></td></tr>
    <tr><td class="lbl">TEL:</td><td class="colon">:</td><td><input id="tel" value="" style="width:180px"></td></tr>
    <tr><td class="lbl">DATE OF AGREEMENT</td><td class="colon">:</td><td><input id="doa" oninput="calcDue()" style="width:130px"></td></tr>
    <tr><td class="lbl">DUE DATE</td><td class="colon">:</td><td><input id="due" readonly style="border-bottom:none;width:130px"></td></tr>
    <tr><td class="lbl">BY MONTH(S)</td><td class="colon">:</td><td><input id="months" value="3" style="width:50px" oninput="calcStat();calcDue()"></td></tr>
    <tr><td class="lbl">% INTEREST</td><td class="colon">:</td><td><input id="interest" value="30" style="width:40px" oninput="calc()"><span style="margin-left:2px">%</span></td></tr>
  </table>

  <div style="font-weight:bold; margin-top:16px; font-size:13px;">COSTING DESCRIPTION</div>

  <div class="sec-head">(A) SETTLEMENT</div>
  <div id="settlement"></div>
  <div id="settlement-empty" class="row" style="height:20px"></div>
  <button class="additem" onclick="addItem('settlement')">+ Add Item</button>
  <div class="totrow"><div class="tlbl">TOTAL :</div><div class="tamt" id="totA">0.00</div></div>

  <div class="sec-head" style="margin-top:20px;">(B) OTHERS CHARGES</div>
  <div class="row noprint" style="border-bottom:1px solid #eee; padding-bottom:6px;">
    <div class="name" style="font-weight:bold">BASIC SALARY (per month)</div>
    <div class="amt"><input class="num" id="basic" value="" placeholder="0.00" style="width:108px" oninput="calcStat()"></div>
    <span style="width:22px;flex:0 0 22px;display:inline-block"></span>
  </div>
  <div class="row noprint" style="font-size:11px; color:#888; padding:2px 0;">
    <div class="name" style="padding-left:12px">↳ PCB (auto·single, ×<span id="pcbMul">3</span>) <span style="cursor:pointer;color:#2c6fbb" onclick="document.getElementById('pcb').value='';calcStat()" title="reset to auto">↺</span></div>
    <div class="amt"><input class="num" id="pcb" value="" placeholder="auto" style="width:108px" oninput="calcStat()"></div>
    <span style="width:22px;flex:0 0 22px;display:inline-block"></span>
  </div>
  <div id="chargesTop"></div>
  <button class="additem" onclick="addItem('chargesTop')">+ Add Item</button>
  <div id="chargesBottom"></div>
  <div class="totrow"><div class="tlbl">TOTAL :</div><div class="tamt" id="totB">0.00</div></div>

  <div style="margin-top:20px;">
    <div class="totrow" style="border:none;"><div class="tlbl" style="text-align:left; padding-left:0;">PRINCIPAL AMOUNT (A+B)</div><div class="pamt" id="principal">0.00</div></div>
    <div class="totrow" style="border:none;"><div class="tlbl"><span id="intPct">30</span>% :</div><div class="pamt underline" id="intAmt">0.00</div></div>
    <div class="totrow" style="border:none;"><div class="tlbl"></div><div class="pamt dblunderline" id="grand">0.00</div></div>
    <div class="totrow" style="border:none; margin-top:10px;"><div class="tlbl" style="text-align:left; padding-left:0; font-weight:bold;">TOTAL TO BANK IN CLIENT'S ACCT</div><div class="pamt" id="tobank" style="font-weight:bold; color:#c00;">0.00</div></div>
  </div>

  <table style="margin-top:60px;">
    <tr class="blue"><td class="lbl" style="width:150px">ACCOUNT RECORD:</td><td class="blue">&nbsp;&nbsp; <select id="bank" onchange="if(this.value==='__OTHER__'){this.style.display='none';var o=document.getElementById('bankOther');o.style.display='inline-block';o.focus();}" style="width:210px; color:#2c6fbb; font-weight:bold; text-transform:uppercase; border:none; border-bottom:1px dashed #bbb; background:transparent; font-family:inherit; font-size:inherit;">
      <option value="">— SELECT BANK —</option>
      <option>MAYBANK</option>
      <option>CIMB BANK</option>
      <option>PUBLIC BANK</option>
      <option>RHB BANK</option>
      <option>HONG LEONG BANK</option>
      <option>AMBANK</option>
      <option>BANK ISLAM</option>
      <option>BANK RAKYAT</option>
      <option>BSN</option>
      <option>OCBC BANK</option>
      <option>HSBC BANK</option>
      <option>UOB BANK</option>
      <option>STANDARD CHARTERED</option>
      <option>AFFIN BANK</option>
      <option>ALLIANCE BANK</option>
      <option>MBSB BANK</option>
      <option>AGROBANK</option>
      <option>CITIBANK</option>
      <option value="__OTHER__">OTHER…</option>
    </select><input id="bankOther" placeholder="TYPE BANK NAME" ondblclick="this.style.display='none';this.value='';var s=document.getElementById('bank');s.value='';s.style.display='inline-block';" title="Double-click to pick from list again" style="width:210px; color:#2c6fbb; font-weight:bold; text-transform:uppercase; border:none; border-bottom:1px dashed #bbb; background:transparent; font-family:inherit; font-size:inherit; display:none;"></td></tr>
    <tr><td></td><td class="blue">&nbsp;&nbsp; <input id="acct" value="" placeholder="ACCOUNT NO." style="width:200px; color:#2c6fbb; font-weight:bold"></td></tr>
  </table>
</div>

<script>
const fmt = n => n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const parse = s => parseFloat(String(s).replace(/,/g,''))||0;

function rowHTML(name='', amt='') {
  return `<div class="row">
    <div class="name"><input value="${name}" placeholder="Description"></div>
    <div class="amt"><input class="num" value="${amt}" oninput="calc()" onblur="fmtInput(this)" placeholder="0.00"></div>
    <button class="del" onclick="this.parentElement.remove();calc()">×</button>
  </div>`;
}
function rowHTML2(name='', bank='', amt='') {
  return `<div class="row">
    <div style="flex:1"><input value="${name}" placeholder="Name / Description" style="width:200px"></div>
    <div style="flex:1;text-align:center"><input value="${bank}" placeholder="Bank Acc" style="width:160px;text-align:left"></div>
    <div class="amt"><input class="num" value="${amt}" oninput="calc()" onblur="fmtInput(this)" placeholder="0.00"></div>
    <button class="del" onclick="this.parentElement.remove();calc()">×</button>
  </div>`;
}
function fmtInput(el){
  const v=parse(el.value);
  el.value = el.value.trim()==='' ? '' : fmt(v);
  calc();
}
function addItem(sec){
  const html = sec==='settlement' ? rowHTML2() : rowHTML();
  const c=document.getElementById(sec);
  c.insertAdjacentHTML('beforeend', html);
  c.querySelectorAll('input').forEach((el,i)=>{ el.setAttribute('autocomplete','off'); if(!el.name) el.setAttribute('name','x'+Date.now()+i); });
  calc();
}

// seed default rows
document.getElementById('settlement').innerHTML = '';
document.getElementById('chargesTop').innerHTML =
  `<div class="row"><div class="name">EPF <span style="cursor:pointer;color:#2c6fbb;font-size:11px" onclick="document.getElementById('epfAmt').dataset.manual='';calcStat()" title="reset to auto">↺</span></div><div class="amt"><input class="num" id="epfAmt" value="0.00" oninput="this.dataset.manual='1';calc()" onblur="fmtInput(this)" style="width:108px"></div><span style="width:22px;flex:0 0 22px;display:inline-block"></span></div>` +
  `<div class="row"><div class="name">SOCSO+EIS+PCB <span style="cursor:pointer;color:#2c6fbb;font-size:11px" onclick="document.getElementById('socsoAmt').dataset.manual='';calcStat()" title="reset to auto">↺</span></div><div class="amt"><input class="num" id="socsoAmt" value="0.00" oninput="this.dataset.manual='1';calc()" onblur="fmtInput(this)" style="width:108px"></div><span style="width:22px;flex:0 0 22px;display:inline-block"></span></div>`;
document.getElementById('chargesBottom').innerHTML =
  rowHTML('MAJIKAN & VERIFY','') +
  rowHTML('LAWYER FEES','800.00');

function sumSec(sec){
  let t=0;
  document.querySelectorAll('#'+sec+' .amt input').forEach(i=>t+=parse(i.value));
  return t;
}
function fmtDate(d){
  return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();
}
function parseDate(s){
  const p=String(s).split('/');
  if(p.length!==3) return null;
  const d=new Date(+p[2], +p[1]-1, +p[0]);
  return isNaN(d)?null:d;
}
function calcDue(){
  const start=parseDate(document.getElementById('doa').value);
  if(!start){ document.getElementById('due').value=''; return; }
  const m=parseInt(document.getElementById('months').value)||0;
  const day=start.getDate();
  const due=new Date(start.getFullYear(), start.getMonth()+m, 1);
  // clamp to last day of target month if original day overflows
  const lastDay=new Date(due.getFullYear(), due.getMonth()+1, 0).getDate();
  due.setDate(Math.min(day, lastDay));
  document.getElementById('due').value=fmtDate(due);
}
// default DOA = today
document.getElementById('doa').value=fmtDate(new Date());
calcDue();

// default title with today's date (e.g. FINPRO AGREEMENT 11TH AUGUST 2026)
(function(){
  const d=new Date();
  const months=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  const day=d.getDate();
  const suf=(day%10===1&&day!==11)?'ST':(day%10===2&&day!==12)?'ND':(day%10===3&&day!==13)?'RD':'TH';
  document.getElementById('hdr').value='FINPRO AGREEMENT '+day+suf+' '+months[d.getMonth()]+' '+d.getFullYear();
})();

// Official PERKESO Category 1 SOCSO table 2026 [wageTo, employer, employee]
const SOCSO_CAT1=[[30,0.40,0.10],[50,0.70,0.20],[70,1.10,0.30],[100,1.50,0.40],[140,2.10,0.60],[200,2.95,0.85],[300,4.35,1.25],[400,6.15,1.75],[500,7.85,2.25],[600,9.65,2.75],[700,11.35,3.25],[800,13.15,3.75],[900,14.85,4.25],[1000,16.65,4.75],[1100,18.35,5.25],[1200,20.15,5.75],[1300,21.85,6.25],[1400,23.65,6.75],[1500,25.35,7.25],[1600,27.15,7.75],[1700,28.85,8.25],[1800,30.65,8.75],[1900,32.35,9.25],[2000,34.15,9.75],[2100,35.85,10.25],[2200,37.65,10.75],[2300,39.35,11.25],[2400,41.15,11.75],[2500,42.85,12.25],[2600,44.65,12.75],[2700,46.35,13.25],[2800,48.15,13.75],[2900,49.85,14.25],[3000,51.65,14.75],[3100,53.35,15.25],[3200,55.15,15.75],[3300,56.85,16.25],[3400,58.65,16.75],[3500,60.35,17.25],[3600,62.15,17.75],[3700,63.85,18.25],[3800,65.65,18.75],[3900,67.35,19.25],[4000,69.15,19.75],[4100,70.85,20.25],[4200,72.65,20.75],[4300,74.35,21.25],[4400,76.15,21.75],[4500,77.85,22.25],[4600,79.65,22.75],[4700,81.35,23.25],[4800,83.15,23.75],[4900,84.85,24.25],[5000,86.65,24.75],[5100,88.35,25.25],[5200,90.15,25.75],[5300,91.85,26.25],[5400,93.65,26.75],[5500,95.35,27.25],[5600,97.15,27.75],[5700,98.85,28.25],[5800,100.65,28.75],[5900,102.35,29.25],[6000,104.15,74.40]];
// Official EIS table 2026 [wageTo, each side]
const EIS_TBL=[[30,0.05],[50,0.10],[100,0.20],[200,0.30],[300,0.50],[400,0.70],[500,0.90],[600,1.10],[700,1.30],[800,1.50],[900,1.70],[1000,1.90],[1100,2.10],[1200,2.30],[1300,2.50],[1400,2.70],[1500,2.90],[1600,3.10],[1700,3.30],[1800,3.50],[1900,3.70],[2000,3.90],[2100,4.10],[2200,4.30],[2300,4.50],[2400,4.70],[2500,4.90],[2600,5.10],[2700,5.30],[2800,5.50],[2900,5.70],[3000,5.90],[3100,6.10],[3200,6.30],[3300,6.50],[3400,6.70],[3500,6.90],[3600,7.10],[3700,7.30],[3800,7.50],[3900,7.70],[4000,7.90],[4100,8.10],[4200,8.30],[4300,8.50],[4400,8.70],[4500,8.90],[4600,9.10],[4700,9.30],[4800,9.50],[4900,9.70],[5000,9.90],[5200,10.30],[5400,10.70],[5600,11.10],[5800,11.50],[6000,11.90]];
function lookupSocso(w){ if(w<=0)return[0,0]; for(const r of SOCSO_CAT1){ if(w<=r[0])return[r[1],r[2]]; } return[104.15,74.40]; }
function lookupEis(w){ if(w<=0)return[0,0]; for(const r of EIS_TBL){ if(w<=r[0])return[r[1],r[1]]; } return[11.90,11.90]; }
// Auto monthly PCB (MTD) estimate — single, no dependents, 2026 resident rates
function autoPCB(monthlyWage){
  if(monthlyWage<=0) return 0;
  const epfEe=Math.min(monthlyWage*0.11*12, 4000); // employee EPF relief cap 4000
  const ch = monthlyWage*12 - 9000 - epfEe; // chargeable income (individual relief 9000)
  if(ch<=5000) return 0;
  // 2026 resident bands: [lower, upper, rate, taxAtLower]
  const bands=[
    [5000,20000,0.01,0],
    [20000,35000,0.03,150],
    [35000,50000,0.06,600],
    [50000,70000,0.11,1500],
    [70000,100000,0.19,3700],
    [100000,400000,0.25,9400],
    [400000,600000,0.26,84400],
    [600000,2000000,0.28,136400],
    [2000000,Infinity,0.30,528400]
  ];
  let tax=0;
  for(const [lo,hi,rate,base] of bands){
    if(ch>lo && ch<=hi){ tax=base+(ch-lo)*rate; break; }
  }
  return Math.max(tax/12,0);
}
function calcStat(){
  const months=parseInt(document.getElementById('months').value)||3;
  document.getElementById('pcbMul').textContent=months;
  let wage=parse(document.getElementById('basic').value);
  // EPF: employer 13% + employee 11% = 24%
  const epf = wage>0 ? wage*0.24*months : 0;
  // SOCSO + EIS from official banded tables (ceiling RM6000)
  const [socsoEr,socsoEe]=lookupSocso(wage);
  const [eisEr,eisEe]=lookupEis(wage);
  const socsoEis = (socsoEr+socsoEe+eisEr+eisEe)*months;
  const pcbField=document.getElementById('pcb');
  const pcbMonthly = pcbField.value.trim()==='' ? autoPCB(wage) : parse(pcbField.value);
  pcbField.placeholder = fmt(autoPCB(wage));
  const pcb = pcbMonthly*months;
  const epfEl=document.getElementById('epfAmt'), socEl=document.getElementById('socsoAmt');
  if(!epfEl.dataset.manual) epfEl.value=fmt(epf);
  if(!socEl.dataset.manual) socEl.value=fmt(socsoEis+pcb);
  calc();
}
function calc(){
  const r2=x=>Math.round(x*100)/100;
  const emptyEl=document.getElementById('settlement-empty');
  if(emptyEl) emptyEl.style.display = document.querySelectorAll('#settlement .row').length ? 'none' : 'block';
  const a=r2(sumSec('settlement')), b=r2(sumSec('chargesTop')+sumSec('chargesBottom'));
  document.getElementById('totA').textContent=fmt(a);
  document.getElementById('totB').textContent=fmt(b);
  const principal=r2(a+b);
  document.getElementById('principal').textContent=fmt(principal);
  const pct=parse(document.getElementById('interest').value);
  document.getElementById('intPct').textContent=pct;
  const intAmt=r2(principal*pct/100);
  document.getElementById('intAmt').textContent=fmt(intAmt);
  const grand=r2(principal+intAmt);
  document.getElementById('grand').textContent=fmt(grand);
  // to bank = Part B total + interest amount
  document.getElementById('tobank').textContent=fmt(r2(b+intAmt));
}
function toggleChk(el, otherId){
  if(el.textContent==='✓'){ el.textContent=''; }
  else { el.textContent='✓'; document.getElementById('chk-'+otherId).textContent=''; }
}
// ---- Save / Load archive (browser localStorage) ----
const ARCH_KEY='finpro_archives';
function getArchives(){ try{return JSON.parse(localStorage.getItem(ARCH_KEY)||'{}');}catch(e){return {};} }
function syncAttrs(sec){
  // 把用户输入的当前值写回 HTML 属性，否则 innerHTML 抓到的是旧的初始值
  document.querySelectorAll('#'+sec+' input').forEach(el=>{
    el.setAttribute('value', el.value);
  });
}
function snapshot(){
  syncAttrs('settlement'); syncAttrs('chargesTop'); syncAttrs('chargesBottom');
  const ids=['hdr','name','tel','doa','due','months','interest','basic','pcb','acct','bank','bankOther'];
  const fields={};
  ids.forEach(id=>{ const el=document.getElementById(id); if(el) fields[id]=el.value; });
  const epfEl=document.getElementById('epfAmt'), socEl=document.getElementById('socsoAmt');
  return {
    fields,
    bankDisplay: document.getElementById('bank').style.display,
    bankOtherDisplay: document.getElementById('bankOther').style.display,
    settlement: document.getElementById('settlement').innerHTML,
    chargesTop: document.getElementById('chargesTop').innerHTML,
    chargesBottom: document.getElementById('chargesBottom').innerHTML,
    epfManual: epfEl ? (epfEl.dataset.manual||'') : '',
    socsoManual: socEl ? (socEl.dataset.manual||'') : '',
    epfVal: epfEl ? epfEl.value : '',
    socsoVal: socEl ? socEl.value : ''
  };
}
function restore(s){
  Object.keys(s.fields).forEach(id=>{ const el=document.getElementById(id); if(el) el.value=s.fields[id]; });
  document.getElementById('bank').style.display=s.bankDisplay||'inline-block';
  document.getElementById('bankOther').style.display=s.bankOtherDisplay||'none';
  document.getElementById('settlement').innerHTML=s.settlement||'';
  document.getElementById('chargesTop').innerHTML=s.chargesTop||'';
  document.getElementById('chargesBottom').innerHTML=s.chargesBottom||'';
  ['settlement','chargesTop','chargesBottom'].forEach(sec=>{
    document.querySelectorAll('#'+sec+' input').forEach((el,i)=>{
      el.setAttribute('autocomplete','off');
      if(!el.name) el.setAttribute('name','x'+Date.now()+i);
    });
  });
  // restore manual-override flags & values for EPF / SOCSO+EIS+PCB rows,
  // otherwise calcStat() below would overwrite hand-typed amounts with auto values
  const epfEl=document.getElementById('epfAmt'), socEl=document.getElementById('socsoAmt');
  if(epfEl){
    if(s.epfManual){ epfEl.dataset.manual=s.epfManual; if(s.epfVal!=null) epfEl.value=s.epfVal; }
    else { delete epfEl.dataset.manual; }
  }
  if(socEl){
    if(s.socsoManual){ socEl.dataset.manual=s.socsoManual; if(s.socsoVal!=null) socEl.value=s.socsoVal; }
    else { delete socEl.dataset.manual; }
  }
  calcStat();
}
function saveArchive(){
  const nm=(document.getElementById('name').value||'').trim().toUpperCase();
  const suggested = nm ? nm : ('存档 '+new Date().toLocaleString());
  const label=prompt('存档名称（同名会覆盖）：', suggested);
  if(label===null) return;
  const key=label.trim().toUpperCase(); if(!key){ alert('名称不能空白'); return; }
  const arch=getArchives();
  arch[key]={data:snapshot(), saved:new Date().toISOString()};
  try{ localStorage.setItem(ARCH_KEY, JSON.stringify(arch)); alert('已存档：'+key); }
  catch(e){ alert('存档失败：浏览器空间不足'); }
}
function loadArchive(){
  const arch=getArchives();
  const keys=Object.keys(arch);
  if(!keys.length){ alert('还没有任何存档'); return; }
  let modal=document.getElementById('archModal');
  if(!modal){
    modal=document.createElement('div');
    modal.id='archModal';
    modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:9999;';
    modal.innerHTML='<div id="archBox" style="background:#fff;border-radius:8px;max-width:460px;width:90%;max-height:80vh;overflow:auto;padding:18px;box-shadow:0 4px 20px rgba(0,0,0,.3);text-transform:none;"></div>';
    modal.onclick=function(e){ if(e.target===modal) modal.remove(); };
    document.body.appendChild(modal);
  }
  const box=modal.querySelector('#archBox');
  box.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><b style="font-size:15px;">读取存档</b><span onclick="document.getElementById(\'archModal\').remove()" style="cursor:pointer;font-size:20px;color:#888;">×</span></div>'
    +'<input id="archSearch" placeholder="🔍 搜索名字…" oninput="renderArchList(this.value)" style="width:100%;padding:8px 10px;margin-bottom:10px;border:1px solid #ccc;border-radius:6px;font-size:14px;box-sizing:border-box;text-transform:none;">'
    +'<div id="archList"></div>';
  const s=box.querySelector('#archSearch');
  renderArchList('');
  s.focus();
}
function renderArchList(q){
  const arch=getArchives();
  const keys=Object.keys(arch).filter(k=>k.toLowerCase().includes((q||'').toLowerCase()));
  const list=document.getElementById('archList');
  if(!list) return;
  if(!keys.length){ list.innerHTML='<div style="color:#999;padding:12px 6px;">没有符合的存档</div>'; return; }
  let html='';
  keys.forEach(k=>{
    const when=new Date(arch[k].saved).toLocaleString();
    const kEsc=k.replace(/'/g,"\\'");
    html+='<div style="display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid #eee;">'
      +'<div style="flex:1;cursor:pointer;" onclick="pickArchive(\''+kEsc+'\')">'
      +'<div style="font-weight:bold;color:#2c6fbb;">'+k+'</div>'
      +'<div style="font-size:11px;color:#999;">'+when+'</div></div>'
      +'<button onclick="delArchive(\''+kEsc+'\')" style="border:none;background:none;color:#c00;cursor:pointer;font-size:16px;padding:4px 8px;">🗑</button>'
      +'</div>';
  });
  list.innerHTML=html;
}
function pickArchive(k){
  const arch=getArchives();
  if(arch[k]){ restore(arch[k].data); document.getElementById('archModal').remove(); }
}
function delArchive(k){
  if(!confirm('删除存档「'+k+'」？')) return;
  const arch=getArchives();
  delete arch[k];
  localStorage.setItem(ARCH_KEY,JSON.stringify(arch));
  const s=document.getElementById('archSearch');
  if(Object.keys(arch).length){ renderArchList(s?s.value:''); }
  else { document.getElementById('archModal').remove(); }
}
// ---- Bank full name -> short code ----
const BANK_SHORT = {
  'MAYBANK':'MBB','CIMB BANK':'CIMB','PUBLIC BANK':'PBB','RHB BANK':'RHB',
  'HONG LEONG BANK':'HLB','AMBANK':'AMBANK','BANK ISLAM':'BIMB','BANK RAKYAT':'BKRM',
  'BSN':'BSN','OCBC BANK':'OCBC','HSBC BANK':'HSBC','UOB BANK':'UOB',
  'STANDARD CHARTERED':'SCB','AFFIN BANK':'AFFIN','ALLIANCE BANK':'ABMB',
  'MBSB BANK':'MBSB','AGROBANK':'AGRO','CITIBANK':'CITI'
};
function currentBank(){
  const sel=document.getElementById('bank');
  const other=document.getElementById('bankOther');
  let full = (other && other.style.display!=='none' && other.value.trim()) ? other.value.trim().toUpperCase() : (sel.value||'').trim().toUpperCase();
  return { full, short: BANK_SHORT[full] || full };
}
// ---- SETTLEMENT COPY ----
function settlementCopy(){
  const rows=document.querySelectorAll('#settlement .row');
  const lines=[];
  rows.forEach(r=>{
    const ins=r.querySelectorAll('input');
    const name=(ins[0]?ins[0].value:'').trim();
    const bank=(ins[1]?ins[1].value:'').trim();
    const amt=(ins[2]?ins[2].value:'').trim();
    if(!name && !bank && !amt) return;
    let line=name;
    if(bank) line += (line?' ':'')+bank;
    line += ' - RM'+amt;
    lines.push(line);
  });
  const txt=
`PLS ASSIST TO DO PAYMENT THANKS

SETTLEMENT
${lines.join('\n')}`.toUpperCase();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>alert('已复制 SETTLEMENT ✓')).catch(()=>fallbackCopy(txt));
  } else { fallbackCopy(txt); }
}
// ---- FUNDER COPY ----
function funderCopy(){
  const nm=(document.getElementById('name').value||'').trim().toUpperCase();
  const amt=(document.getElementById('tobank').textContent||'').trim();
  const acct=(document.getElementById('acct').value||'').trim();
  const bank=currentBank().short;
  const txt=
`PLS ASSIST TO DO PAYMENT THANKS

FUNDER TRANSFER
RM ${amt}

${bank}
${acct}
${nm}`.toUpperCase();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>alert('已复制 FUNDER ✓')).catch(()=>fallbackCopy(txt));
  } else { fallbackCopy(txt); }
}
// ---- Copy customer notice ----
function copyNotice(){
  const nm=(document.getElementById('name').value||'').trim().toUpperCase();
  const tel=(document.getElementById('tel').value||'').trim();
  const txt=
`PLS CALL CUSTOMER

NAME : ${nm}
TEL : ${tel}

‼️通知顾客‼️
* 签名后通知我们安排FUNDER汇钱
* 顾客需要当场转FUNDER钱回来
* 并且给律师或AGENT拍RESIT
* 记得把BANK开大LIMIT
* SETTLEMENT过后再处理`;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>alert('已复制通知 ✓')).catch(()=>fallbackCopy(txt));
  } else { fallbackCopy(txt); }
}
function fallbackCopy(txt){
  const ta=document.createElement('textarea');
  ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); alert('已复制通知 ✓'); }
  catch(e){ alert('复制失败，请手动复制'); }
  document.body.removeChild(ta);
}
