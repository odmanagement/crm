<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loan CRM</title>
<style>
  html, body { margin: 0; padding: 0; background: #f4f5fb; }
  #root { min-height: 100vh; }
  .boot { font-family: sans-serif; padding: 60px; text-align: center; color: #64748b; }
  .calc-in { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 5px 8px; font-size: 14px; font-family: inherit; color: #0f172a; outline: none; min-width: 0; box-sizing: border-box; }
  .calc-in:hover { background: #f8fafc; }
  .calc-in:focus { background: #fff; border-color: #c4b5fd; }
  .calc-in::placeholder { color: #cbd5e1; }
  .bank-row-p { flex-wrap: nowrap; gap: 4px !important; }
  .bank-row-p > * { font-size: 12px !important; padding-left: 6px !important; padding-right: 4px !important; }
  .bank-row-p > input:nth-child(1), .bank-row-p > input:nth-child(2) { flex: 1 1 70px !important; }
  .bank-row-p > select:nth-of-type(1) { flex: 0 0 100px !important; }
  .bank-row-p > input:nth-child(4) { flex: 0 0 76px !important; width: 76px !important; }
  .bank-row-p > select:nth-of-type(2) { flex: 0 0 132px !important; }
  .bank-row-p > input[type=date] { flex: 0 0 118px !important; width: 118px !important; }
  .bank-row-p > button { flex: 0 0 28px !important; padding: 0 !important; }
  .calc-in:disabled { color: #7c3aed !important; background: #f5f3ff !important; border-color: #ede9fe !important; cursor: help; -webkit-text-fill-color: #7c3aed; opacity: 1; }
  .calc-in::-webkit-outer-spin-button, .calc-in::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .calc-in[type=number] { -moz-appearance: textfield; }
  .calc-del { opacity: .35; } .calc-row:hover .calc-del { opacity: 1; }
  @media (hover: none) { .calc-del { opacity: .6; } }
</style>

const _v = x => (x === undefined || x === null || x === "") ? "(empty)" : (x === true ? "Yes" : (x === false ? "No" : String(x)));
function diffClient(oldC, newC, user) {
  const out = [];
  const when = _now();
  const by = user || "someone";
  // 客户级字段
  ["name","phone","ic","job","income","note","flag"].forEach(k => {
    if ((oldC[k] || "") !== (newC[k] || "") && !(k==="flag" && !oldC[k]===!newC[k])) {
      if (String(oldC[k]||"") !== String(newC[k]||"")) out.push({ by, when, field: _fieldLabel[k]||k, from: _v(oldC[k]), to: _v(newC[k]) });
    }
  });
  // 贷款
  const oldLoans = oldC.loans || [], newLoans = newC.loans || [];
  newLoans.forEach(nl => {
    const ol = oldLoans.find(x => x.id === nl.id);
    if (!ol) { out.push({ by, when, field: "Loan", from: "(none)", to: (typeOf(nl.type).short || "loan") + " added" }); return; }
    ["amount","subject","stage","link","agent","lawyer","supplies","banker","size","date","approved","lucasCost","note"].forEach(k => {
      if (String(ol[k]||"") !== String(nl[k]||"")) out.push({ by, when, field: _fieldLabel[k]||k, from: _v(ol[k]), to: _v(nl[k]) });
    });
    // 银行
    const ob = ol.banks || [], nb = nl.banks || [];
    nb.forEach(b => {
      const o = ob.find(x => x.bank === b.bank);
      if (!o) out.push({ by, when, field: "Bank " + b.bank, from: "(none)", to: (b.amount? "RM "+b.amount : (b.officer||b.status)) });
      else if (String(o.amount||"")!==String(b.amount||"") || String(o.officer||"")!==String(b.officer||"") || (o.status||"")!==(b.status||""))
        out.push({ by, when, field: "Bank " + b.bank, from: (o.amount?"RM "+o.amount:(o.officer||o.status||"-")), to: (b.amount?"RM "+b.amount:(b.officer||b.status||"-")) });
    });
    ob.forEach(b => { if (!nb.find(x=>x.bank===b.bank)) out.push({ by, when, field: "Bank " + b.bank, from: "(had)", to: "(removed)" }); });
  });
  oldLoans.forEach(ol => { if (!newLoans.find(x=>x.id===ol.id)) out.push({ by, when, field: "Loan", from: (typeOf(ol.type).short||"loan"), to: "(removed)" }); });
  return out;
}
