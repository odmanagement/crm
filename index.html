function diffClient(oldC, newC, user) {
  const out = [];
  const when = _now();
  const by = user || "someone";
  // 客户级字段
  ["name","phone","ic","job","income","note","flag"].forEach(k => {
    if ((oldC[k] || "") !== (newC[k] || "") && !(k==="flag" && !oldC[k]===!newC[k])) {
      if (String(oldC[k]||"") !== String(newC[k]||"")) out.push({ by, when, field: _fieldLabel[k]||k, from: _v(oldC[k]), to: _v(newC[k]) });
    }
  });
  // 贷款
  const oldLoans = oldC.loans || [], newLoans = newC.loans || [];
  newLoans.forEach(nl => {
    const ol = oldLoans.find(x => x.id === nl.id);
    if (!ol) { out.push({ by, when, field: "Loan", from: "(none)", to: (typeOf(nl.type).short || "loan") + " added" }); return; }
    ["amount","subject","stage","link","agent","lawyer","supplies","banker","size","date","approved","lucasCost","note"].forEach(k => {
      if (String(ol[k]||"") !== String(nl[k]||"")) out.push({ by, when, field: _fieldLabel[k]||k, from: _v(ol[k]), to: _v(nl[k]) });
    });
    // 银行
    const ob = ol.banks || [], nb = nl.banks || [];
    nb.forEach(b => {
      const o = ob.find(x => x.bank === b.bank);
      if (!o) out.push({ by, when, field: "Bank " + b.bank, from: "(none)", to: (b.amount? "RM "+b.amount : (b.officer||b.status)) });
      else if (String(o.amount||"")!==String(b.amount||"") || String(o.officer||"")!==String(b.officer||"") || (o.status||"")!==(b.status||""))
        out.push({ by, when, field: "Bank " + b.bank, from: (o.amount?"RM "+o.amount:(o.officer||o.status||"-")), to: (b.amount?"RM "+b.amount:(b.officer||b.status||"-")) });
    });
    ob.forEach(b => { if (!nb.find(x=>x.bank===b.bank)) out.push({ by, when, field: "Bank " + b.bank, from: "(had)", to: "(removed)" }); });
  });
  oldLoans.forEach(ol => { if (!newLoans.find(x=>x.id===ol.id)) out.push({ by, when, field: "Loan", from: (typeOf(ol.type).short||"loan"), to: "(removed)" }); });
  return out;
}

.pfx-stars { background: linear-gradient(180deg,#faf5ff,#f5f3ff 50%,#fdf4ff); }
.pfx-stars .st { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #a78bfa; box-shadow: 0 0 10px #c4b5fd; animation: twinkle ease-in-out infinite; }
.pfx-stars .ck { width: auto; height: auto; background: none; box-shadow: none; color: #10b981; font-weight: 900; font-size: 16px; text-shadow: 0 0 10px rgba(16,185,129,.5); }
@keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.3); } }
/* 其他：柔和渐变 */
.pfx-mesh { background: #f3f4fa; }
.pfx-mesh .m { position: absolute; width: 60vw; height: 60vw; border-radius: 50%; filter: blur(80px); opacity: .35; }
.pfx-mesh .m1 { background: #a78bfa; left: -20vw; top: -30vw; animation: drift1 24s ease-in-out infinite; }
.pfx-mesh .m2 { background: #7dd3fc; right: -20vw; bottom: -30vw; animation: drift2 28s ease-in-out infinite; }
/* 每页不同的进场动画 */
.pg-anim > * { animation-duration: .8s; animation-timing-function: cubic-bezier(.16,1,.3,1); animation-fill-mode: backwards; }
.pg-house > * { animation-name: inUp; }
.pg-car > * { animation-name: inRight; }
.pg-personal > * { animation-name: inZoom; }
.pg-verify > * { animation-name: inBlur; }
.pg-reports > * { animation-name: inRise; }
.pg-html_forms > * { animation-name: inFlip; }
.pg-html_company > * { animation-name: inPop; }
.pg-banker > * { animation-name: inLeft; }
.pg-mission > * { animation-name: inDrop; }
.pg-clients > * { animation-name: inUp; }
@keyframes inUp { from { opacity: 0; transform: translateY(24px); } }
@keyframes inRight { from { opacity: 0; transform: translateX(60px) skewX(-4deg); } }
@keyframes inLeft { from { opacity: 0; transform: translateX(-60px); } }
@keyframes inZoom { from { opacity: 0; transform: scale(.92); } }
@keyframes inBlur { from { opacity: 0; filter: blur(12px); } }
@keyframes inRise { from { opacity: 0; transform: perspective(900px) rotateX(18deg) translateY(40px); } }
@keyframes inFlip { from { opacity: 0; transform: perspective(900px) rotateY(-25deg); transform-origin: left; } }
@keyframes inPop { from { opacity: 0; transform: scale(.85); } 70% { transform: scale(1.02); } }
@keyframes inDrop { from { opacity: 0; transform: translateY(-40px); } 70% { transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .pfx * { animation: none !important; } .pg-anim > * { animation: none !important; } }
.cz-page { margin: -28px; padding: 28px; min-height: calc(100vh - 67px); background: transparent; }
.cz-page > div:last-child { border-radius: 16px !important; overflow: hidden; box-shadow: 0 12px 34px -12px rgba(79,70,229,.3) !important; border: 1px solid #e0e7ff !important; }
.cz-table thead tr { background: linear-gradient(90deg,#7c3aed,#4f46e5 45%,#0ea5e9); }
.cz-table thead th { background: transparent !important; color: #fff !important; border-color: rgba(255,255,255,.12) !important; letter-spacing: .03em; }
.cz-table tbody tr td { transition: background .15s; border-color: #eef0fb !important; }
.cz-table tbody tr:nth-child(even) td { background: #fbfaff; }
.cz-table tbody tr:hover td { background: #f3f0ff !important; }
.cz-table select, .cz-table input { cursor: pointer; }
.cz-table select:disabled, .cz-table input:disabled { cursor: not-allowed; opacity: .85; filter: saturate(.7); }
.stat-card:nth-child(2) { animation-delay: .06s; } .stat-card:nth-child(3) { animation-delay: .12s; } .stat-card:nth-child(4) { animation-delay: .18s; }
