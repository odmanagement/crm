<!DOCTYPE html>
<html lang="en" spellcheck="false">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPC Payslip Generator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eceef1;color:#000;font-family:"Segoe UI",Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 10px}
h1{margin:0;font-size:24px}
.sub{font-size:12px;color:#666;margin:2px 0 14px}
.card{background:#fff;border-radius:14px;padding:16px 20px 20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h3{margin:0 0 12px;font-size:15px;padding-bottom:10px;border-bottom:1px solid #eee}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.fld label{display:block;font-size:12px;color:#555;margin-bottom:5px}
.fld input,.fld select{width:100%;height:36px;border:1px solid #d6d9de;border-radius:6px;background:#f7f8fa;padding:0 10px;font-size:14px;font-family:inherit}
.fld input:focus,.fld select:focus{outline:none;border-color:#7a8cff;background:#fff}
.row{display:flex;gap:8px}
.btn{height:36px;border:1px solid #d6d9de;background:#fff;border-radius:6px;padding:0 12px;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit}
.btn:hover{background:#f2f3f5}
.btn.dark{background:#111;color:#fff;border-color:#111}
.btn.dark:hover{background:#333}
.btn.del{color:#c0392b;padding:0 10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.actions label.btn{display:inline-flex;align-items:center}
.actions input[type=file]{display:none}



.sec{margin-top:16px}
.sec h4{margin:0 0 8px;font-size:13px;color:#333}
.items .it{display:flex;gap:8px;margin-bottom:8px}
.items .it input{height:34px;border:1px solid #d6d9de;border-radius:6px;background:#f7f8fa;padding:0 10px;font-size:14px}
.items .it input.d{flex:1}.items .it input.v{width:140px;text-align:right}
.items .it button{width:34px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.amt{text-align:right}
.auto{font-size:11px;color:#888;margin-left:6px}
.man{background:#fff6d6!important}
/* payslip */
.slip{width:297mm;min-height:180mm;margin:16px auto 30px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);padding:12mm 16mm 10mm;
  font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:14px;color:#000;position:relative}
.sh{display:flex;align-items:flex-start;gap:24px;margin-left:30px}
.sh img{width:92px}
.sh .co{padding-top:4px}
.sh .co .n{font-size:21px;font-weight:bold;margin-bottom:12px}
.sh .co div{line-height:19px}
.info{display:flex;justify-content:space-between;margin-top:26px;line-height:19px}
.info .k{display:inline-block;width:92px}
.info .c{display:inline-block;width:12px}
.info .dk{display:inline-block;width:110px}
table.ps{width:100%;border-collapse:collapse;margin-top:14px}
table.ps th,table.ps td{border:1px solid #000;padding:1px 6px;height:19px}
table.ps th{font-weight:bold;text-align:center}
table.ps td.na{border-top:none;border-bottom:none}
table.ps td.am{text-align:right;width:105px;border-top:none;border-bottom:none}
table.ps tr.last td{border-bottom:1px solid #000}
table.ps tr.gap td{border-left:none;border-right:none;height:12px}
table.ps tr.tot td{height:30px}
.ec{border:1px solid #000;margin-top:12px;padding:4px 6px;line-height:20px}
.ec .r{display:flex}
.ec .r span{display:inline-block}
@page{size:A4 landscape;margin:0}
@media print{
 body{background:#fff}.wrap{display:none}
 .slip{margin:0;box-shadow:none;width:297mm;height:210mm;page-break-after:always;padding:14mm 18mm}
 .slip:last-child{page-break-after:auto}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Payslip 生成器 · GPC GEMMOLOGICAL CORRIDOR</h1>
  <div class="sub">填写员工资料 → EPF / SOCSO / EIS / PCB 自动算（可手改）→ 保存 PDF</div>
  <div class="card">
    <h3>员工资料</h3>
    <div class="grid">
      <div class="fld" style="grid-column:span 3">
        <label>快速载入员工资料</label>
        <div class="row">
          <select id="empSel" onchange="loadEmp()"><option value="">— 手动填写 / 选择员工 —</option></select>
          <button class="btn" onclick="saveEmp()">💾 存这个员工</button>
          <button class="btn del" onclick="delEmp()" title="删除所选员工">🗑</button>
        </div>
      </div>
      <div class="fld"><label>Name</label><input id="fName" autocomplete="off"></div>
      <div class="fld"><label>IC No.</label><input id="fIC" autocomplete="off"></div>
      <div class="fld"><label>Position</label><input id="fPos" autocomplete="off"></div>
      <div class="fld"><label>Payslip 月份</label><input type="month" id="fMonth"></div>
      <div class="fld"><label>份数（几个月）</label><select id="fCount"></select></div>
      <div class="fld"><label>时间方向</label><select id="fDir"><option value="back">往前（这个月和之前几个月）</option><option value="fwd">往后（这个月和之后几个月）</option></select></div>
    </div>
    <div class="twocol sec">
      <div>
        <h4>EARNINGS</h4>
        <div class="items" id="earn"></div>
        <button class="btn" onclick="addEarn('','')">＋ Add Item</button>
      </div>
      <div>
        <h4>DEDUCTIONS <span class="auto">留空 = 自动算；填数字 = 手动（黄色）</span></h4>
        <div class="grid" style="grid-template-columns:1fr 1fr">
          <div class="fld"><label>EPF（员工 11%）</label><input class="amt st" id="dEPF" inputmode="decimal"></div>
          <div class="fld"><label>SOCSO</label><input class="amt st" id="dSOCSO" inputmode="decimal"></div>
          <div class="fld"><label>EIS</label><input class="amt st" id="dEIS" inputmode="decimal"></div>
          <div class="fld"><label>PCB</label><input class="amt st" id="dPCB" inputmode="decimal"></div>
        </div>
        <h4 style="margin-top:14px">EMPLOYER CONTRIBUTION</h4>
        <div class="grid">
          <div class="fld"><label>EPF（雇主）</label><input class="amt st" id="eEPF" inputmode="decimal"></div>
          <div class="fld"><label>SOCSO</label><input class="amt st" id="eSOCSO" inputmode="decimal"></div>
          <div class="fld"><label>EIS</label><input class="amt st" id="eEIS" inputmode="decimal"></div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn dark" onclick="printPDF()">🖨 打印 / 保存 PDF</button>
      <button class="btn" onclick="clearForm()">↺ 清空</button>
      <button class="btn" onclick="resetAuto()">↺ 扣款全部恢复自动</button>
      <span style="flex:1"></span>
      <label class="btn">🖼 换 Logo<input type="file" accept="image/*" id="logoUp"></label>
    </div>
  </div>
</div>
<div id="slips"></div>

function up05(x){return Math.ceil(Math.round(x*100)/5-1e-9)*5/100;}
/* statutory (Category 1, below 60) */
function mid(w){const c=Math.min(w,6000);if(c<=0)return 0;return c>=5900?5950:Math.floor(c/100)*100+50;}
function socsoEe(w){return w<=0?0:Math.round(mid(w)*0.005*100)/100;}
function socsoEr(w){return w<=0?0:up05(mid(w)*0.0175);}
function eis(w){return w<=0?0:Math.round(mid(w)*0.002*100)/100;}
function epfEe(w){return Math.ceil(w*0.11);}
function epfEr(w){return Math.ceil(w*(w>5000?0.12:0.13));}
function pcb(w){
  const ann=w*12, epfRel=Math.min(w*0.11*12,4000), ch=Math.max(0,ann-9000-epfRel);
  const B=[[5000,0],[20000,.01],[35000,.03],[50000,.06],[70000,.11],[100000,.19],[400000,.25],[600000,.26],[2000000,.28],[Infinity,.30]];
  let tax=0,prev=0; for(const [lim,r] of B){if(ch>prev){tax+=(Math.min(ch,lim)-prev)*r;} prev=lim;}
  if(ch<=35000)tax=Math.max(0,tax-400);
  return up05(tax/12);
}
function addEarn(d,v){
  const r=document.createElement('div'); r.className='it';
  r.innerHTML='<input class="d" autocomplete="off"><input class="v amt" inputmode="decimal" autocomplete="off"><button class="btn del" title="删除">✕</button>';
  r.querySelector('.d').value=d; r.querySelector('.v').value=v;
  r.querySelectorAll('input').forEach(i=>i.addEventListener('input',render));
  r.querySelector('.v').addEventListener('blur',e=>{const n=num(e.target.value);if(n!==null)e.target.value=m2(n);});
  r.querySelector('button').onclick=()=>{r.remove();render();};
  $('earn').appendChild(r); render();
}
function earnings(){return [...document.querySelectorAll('#earn .it')].map(r=>({d:r.querySelector('.d').value.trim(),v:num(r.querySelector('.v').value)})).filter(x=>x.d||x.v!==null);}
function stat(id,auto){const el=$(id);const v=num(el.value);const man=el.value.trim()!=='';el.classList.toggle('man',man);if(!man)el.placeholder='';return man?v:auto;}
function months(){
  const mv=$('fMonth').value; if(!mv)return [];
  let [y,m]=mv.split('-').map(Number); const n=+$('fCount').value, back=$('fDir').value==='back', out=[];
  for(let i=0;i<n;i++){let mm=m-1+(back?-i:i), yy=y+Math.floor(mm/12); mm=((mm%12)+12)%12; out.push([yy,mm]);}
  out.sort((a,b)=>a[0]-b[0]||a[1]-b[1]); return out;
}
function render(){
  const E=earnings(), gross=E.reduce((s,x)=>s+(x.v||0),0);
  const basic=gross;
  const D={EPF:stat('dEPF',epfEe(basic)),SOCSO:stat('dSOCSO',socsoEe(basic)),EIS:stat('dEIS',eis(basic)),PCB:stat('dPCB',pcb(basic))};
  const R={EPF:stat('eEPF',epfEr(basic)),SOCSO:stat('eSOCSO',socsoEr(basic)),EIS:stat('eEIS',eis(basic))};
  ['dEPF','dSOCSO','dEIS','dPCB','eEPF','eSOCSO','eEIS'].forEach(id=>{const el=$(id);if(el.value.trim()==='')el.setAttribute('data-auto','');});
  // show auto values as hint
  $('dEPF').placeholder=m2(epfEe(basic));$('dSOCSO').placeholder=m2(socsoEe(basic));$('dEIS').placeholder=m2(eis(basic));$('dPCB').placeholder=m2(pcb(basic));
  $('eEPF').placeholder=m2(epfEr(basic));$('eSOCSO').placeholder=m2(socsoEr(basic));$('eEIS').placeholder=m2(eis(basic));
  const ded=D.EPF+D.SOCSO+D.EIS+D.PCB, net=gross-ded;
  const erPct=gross>5000?12:13;
  const name=esc($('fName').value.trim().toUpperCase()), ic=esc($('fIC').value.trim()), pos=esc($('fPos').value.trim().toUpperCase());
  const rows=Math.max(9,E.length);
  const dk=[['EPF',D.EPF],['SOCSO',D.SOCSO],['EIS',D.EIS],['PCB',D.PCB]];
  let body='';
  for(let i=0;i<rows;i++){
    const e=E[i], d=dk[i];
    body+='<tr'+(i===rows-1?' class="last"':'')+'><td class="na">'+(e?esc(e.d):'')+'</td><td class="am">'+(e&&e.v!==null?m2(e.v):'')+'</td><td class="na">'+(d?d[0]:'')+'</td><td class="am">'+(d?m2(d[1]):'')+'</td></tr>';
  }
  const M=months(); const list=M.length?M:[[null,null]];
  $('slips').innerHTML=list.map(([y,m])=>`<div class="slip">
    <div class="sh"><img src="${logo}"><div class="co"><div class="n">GPC GEMMOLOGICAL CORRIDOR SDN BHD</div>
      <div>Company Reg.No : 202301029894 (1523817-A)</div><div>B-G-13A Boulevard Business Park,</div>
      <div>Pusat Komersial Jalan Kuching, Jalan Kepayang, Off Jalan Kuching, 51200 KL.</div><div>Tel: 03-7890 0557</div></div></div>
    <div class="info"><div><span class="k">NAME</span><span class="c">:</span>${name}<br><span class="k">IC NO.</span><span class="c">:</span>${ic}<br><span class="k">POSITION</span><span class="c">:</span>${pos}</div>
      <div style="margin-right:20px"><span class="dk">DATE</span><span class="c">:</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${y===null?'':MS[m]+'-'+String(y).slice(2)}</div></div>
    <table class="ps">
      <colgroup><col style="width:auto"><col style="width:105px"><col style="width:auto"><col style="width:105px"></colgroup>
      <tr><th colspan="2">EARNINGS</th><th colspan="2">DEDUCTIONS</th></tr>
      <tr><th>DESCRIPTION</th><th>AMOUNT</th><th>DESCRIPTION</th><th>AMOUNT</th></tr>
      ${body}
      <tr class="gap"><td colspan="4"></td></tr>
      <tr class="tot"><td style="text-align:right;border-right:none">Gross Earnings RM</td><td class="am" style="border:1px solid #000">${m2(gross)}</td><td style="text-align:right;border-right:none">Gross Deductions RM</td><td class="am" style="border:1px solid #000">${m2(ded)}</td></tr>
      <tr class="tot"><td colspan="3" style="text-align:right;border-right:none;border-top:none">Net Salary RM</td><td class="am" style="border:1px solid #000">${m2(net)}</td></tr>
    </table>
    <div class="ec">EMPLOYER CONTRIBUTION<div class="r"><span style="width:90px">EPF (${erPct}%)</span><span style="width:30px">:</span><span style="width:310px">${m2(R.EPF)}</span><span style="width:70px">SOCSO</span><span style="width:30px">:</span><span style="width:235px">${m2(R.SOCSO)}</span><span style="width:45px">EIS</span><span style="width:20px">:</span><span>${m2(R.EIS)}</span></div></div>
  </div>`).join('');
}
['fName','fIC','fPos','fMonth','fCount','fDir'].forEach(id=>{$(id).addEventListener('input',render);$(id).addEventListener('change',render);});
document.querySelectorAll('.st').forEach(el=>{el.addEventListener('input',render);el.addEventListener('blur',()=>{const n=num(el.value);if(n!==null)el.value=m2(n);render();});});
$('fName').addEventListener('blur',()=>{$('fName').value=$('fName').value.toUpperCase();render();});
function resetAuto(){document.querySelectorAll('.st').forEach(el=>el.value='');render();}
function snapshot(){return {ic:$('fIC').value,pos:$('fPos').value,earn:earnings().map(x=>[x.d,x.v===null?'':m2(x.v)]),st:Object.fromEntries([...document.querySelectorAll('.st')].map(el=>[el.id,el.value]))};}
function getEmps(){try{return JSON.parse(localStorage.getItem(EMP)||'{}');}catch(e){return {};}}
function fillSel(sel){const e=getEmps(),s=$('empSel');s.innerHTML='<option value="">— 手动填写 / 选择员工 —</option>'+Object.keys(e).sort().map(n=>'<option>'+esc(n)+'</option>').join('');if(sel)s.value=sel;}
function saveEmp(){const n=$('fName').value.trim().toUpperCase();if(!n){alert('请先填 Name');return;}const e=getEmps();e[n]=snapshot();try{localStorage.setItem(EMP,JSON.stringify(e));}catch(x){}fillSel(n);alert('已存：'+n);}
function loadEmp(){const n=$('empSel').value;if(!n)return;const p=getEmps()[n];if(!p)return;
  $('fName').value=n;$('fIC').value=p.ic||'';$('fPos').value=p.pos||'';
  $('earn').innerHTML='';(p.earn&&p.earn.length?p.earn:[['Basic Pay','']]).forEach(([d,v])=>addEarn(d,v));
  document.querySelectorAll('.st').forEach(el=>el.value=(p.st&&p.st[el.id])||'');render();}
function delEmp(){const n=$('empSel').value;if(!n){alert('先选一个员工');return;}if(!confirm('删除 '+n+'？'))return;const e=getEmps();delete e[n];try{localStorage.setItem(EMP,JSON.stringify(e));}catch(x){}fillSel();}
function thisMonth(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function clearForm(){$('empSel').value='';['fName','fIC','fPos'].forEach(id=>$(id).value='');$('earn').innerHTML='';addEarn('Basic Pay','');resetAuto();$('fMonth').value=thisMonth();$('fCount').value='1';$('fDir').value='back';render();}
$('logoUp').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{logo=x.target.result;try{localStorage.setItem(KEY,logo);}catch(_){}render();};r.readAsDataURL(f);e.target.value='';});
try{const l=localStorage.getItem(KEY);if(l)logo=l;}catch(e){}
function printPDF(){const n=$('fName').value.trim(),old=document.title;const M=months();
  document.title='Payslip - '+(n||'Employee')+(M.length?' - '+M.map(([y,m])=>MS[m]+String(y).slice(2)).join(','):'');window.print();setTimeout(()=>document.title=old,500);}
fillSel();$('fMonth').value=thisMonth();addEarn('Basic Pay','');
</script>
</body>
</html>
