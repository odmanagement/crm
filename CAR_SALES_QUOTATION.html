<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Sales Quotation</title>
<style>
  :root{
    --ink:#1a2b3c;
    --line:#e8dfa8;
    --accent:#0f5c8c;
    --accent-soft:#faf3cf;
    --label-bg:#fdf8dd;
    --field-bg:#fffdf0;
    --paper:#fffdf2;
    --muted:#8a8250;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
    background:#ffffff;
    color:var(--ink);
    padding:24px 12px;
  }
  .sheet, .sheet input{ text-transform:uppercase; }
  .sheet{
    max-width:640px;
    margin:0 auto;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    box-shadow:0 6px 24px rgba(20,40,60,.08);
    overflow:hidden;
  }
  h1{
    font-size:22px;
    font-weight:800;
    letter-spacing:.5px;
    margin:0;
    padding:18px 22px;
    border-bottom:2px solid var(--accent);
    color:var(--accent);
  }
  .section-title{
    font-weight:700;
    font-size:13px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
    padding:16px 22px 6px;
  }
  .row{
    display:grid;
    grid-template-columns:190px 1fr;
    border-top:1px solid var(--line);
    align-items:stretch;
  }
  .row .label{
    background:var(--label-bg);
    font-weight:600;
    font-size:13.5px;
    padding:10px 22px;
    display:flex;
    align-items:center;
    border-right:1px solid var(--line);
  }
  .row .val{
    padding:4px 10px;
    display:flex;
    align-items:center;
  }
  .row input, .row select{
    width:100%;
    border:none;
    background:var(--field-bg);
    font-size:14px;
    padding:8px 10px;
    color:var(--ink);
    font-family:inherit;
    border-radius:3px;
    outline:none;
  }
  .row input:focus, .row select:focus{
    box-shadow:inset 0 0 0 2px var(--accent);
    background:#fff;
  }
  .readonly input{background:#f0f3f5;color:var(--muted);}
  .price-head{
    display:grid;
    grid-template-columns:190px 1fr 1fr;
    background:var(--accent-soft);
    font-weight:700;
    font-size:12.5px;
    letter-spacing:.5px;
    border-top:1px solid var(--line);
  }
  .price-head div{padding:8px 22px;}
  .total-row{
    display:grid;
    grid-template-columns:190px 1fr;
    border-top:2px solid var(--accent);
    background:var(--accent-soft);
  }
  .total-row .label{
    text-align:center;
    justify-content:center;
    font-weight:800;
    font-size:14px;
    background:transparent;
    border-right:1px solid var(--line);
  }
  .total-row .val{font-weight:800;font-size:16px;color:var(--accent);padding-left:22px;}
  .cb-strip{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    border-top:1px solid var(--line);
  }
  .cb-cell{
    display:flex;
    flex-direction:column;
    border-right:1px solid var(--line);
  }
  .cb-cell:last-child{border-right:none;}
  .cb-cell .cb-head{
    background:var(--label-bg);
    font-weight:600;
    font-size:12px;
    padding:8px 10px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  .cb-cell.bal .cb-head{background:var(--accent-soft);font-weight:800;}
  .cb-cell input{
    border:none;
    background:var(--field-bg);
    font-size:14px;
    padding:9px 8px;
    text-align:center;
    font-family:inherit;
    color:var(--ink);
    outline:none;
    width:100%;
  }
  .cb-cell input:focus{box-shadow:inset 0 0 0 2px var(--accent);background:#fff;}
  .cb-cell.bal input{font-weight:800;color:var(--accent);background:var(--accent-soft);}
  @media(max-width:520px){
    .cb-strip{grid-template-columns:repeat(2,1fr);}
    .cb-cell:nth-child(2n){border-right:none;}
    .cb-cell{border-bottom:1px solid var(--line);}
  }
  /* PART A cashback breakdown page */
  .bank-row{
    display:grid;
    grid-template-columns:1fr 200px;
    border-top:1px solid var(--line);
    align-items:stretch;
  }
  .bank-row .label{
    background:var(--label-bg);
    font-weight:700;
    font-size:14px;
    padding:12px 22px;
    display:flex;align-items:center;
    border-right:1px solid var(--line);
  }
  .bank-row input{
    border:none;background:var(--field-bg);
    font-size:15px;font-weight:700;
    text-align:center;padding:10px 18px;
    width:100%;font-family:inherit;color:var(--ink);outline:none;
  }
  .bank-row input:focus{box-shadow:inset 0 0 0 2px var(--accent);background:#fff;}
  .part-title{
    background:#f0932b;
    color:#fff;
    font-weight:800;
    font-size:14px;
    letter-spacing:1px;
    padding:9px 22px;
    border-top:1px solid var(--line);
  }
  .pa-table{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    border-top:1px solid var(--line);
  }
  .pa-table > div{
    padding:9px 14px;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    font-size:13px;
    display:flex;align-items:center;justify-content:center;
  }
  .pa-table > div:nth-child(4n){border-right:none;}
  .pa-head{
    background:var(--label-bg);
    font-weight:700;
    justify-content:center;
    text-align:center;
    flex-direction:column;
  }
  .pa-head small{font-weight:500;color:var(--muted);font-size:11px;}
  .pa-table input{
    border:none;background:transparent;
    font-size:13.5px;text-align:center;
    width:100%;font-family:inherit;color:var(--ink);outline:none;
  }
  .pa-table .cell-label input{text-align:center;font-weight:600;}
  .pa-table input:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--accent);}
  .pa-table .pa-total{background:var(--accent-soft);font-weight:800;}
  .pa-table .pa-total input{font-weight:800;color:var(--accent);}
  .addon-block{border-top:1px solid var(--line);}
  .addon-row{
    display:grid;
    grid-template-columns:1fr 160px 40px;
    border-bottom:1px solid var(--line);
    align-items:center;
  }
  .addon-row .addon-name{padding:10px 22px;font-size:13.5px;}
  .addon-row input.addon-amt{
    border:none;background:transparent;
    text-align:center;font-size:13.5px;
    padding:10px 8px;width:100%;
    font-family:inherit;color:var(--ink);outline:none;
  }
  .addon-row input.addon-amt:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--accent);}
  .addon-row.final{background:var(--accent-soft);}
  .addon-row.final input.addon-amt{font-weight:800;color:var(--accent);}
  .addon-spacer{display:block;}
  .addon-row .del-item{
    background:rgba(20,40,60,.6);color:#fff;border:none;border-radius:50%;
    width:22px;height:22px;font-size:13px;line-height:1;cursor:pointer;padding:0;
    margin:0 auto;display:block;
  }
  .item-name{
    border:none;background:transparent;font-size:13.5px;
    padding:10px 22px;width:100%;font-family:inherit;color:var(--ink);outline:none;font-weight:600;
  }
  .item-name:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--accent);}
  .btn-additem{
    background:#fff;border:1px dashed var(--accent);color:var(--accent);
    border-radius:5px;padding:6px 14px;font-size:12.5px;font-weight:600;
    cursor:pointer;font-family:inherit;
  }
  .btn-additem:hover{background:var(--accent-soft);}
  .del-fixed{
    background:rgba(20,40,60,.6);color:#fff;border:none;border-radius:50%;
    width:22px;height:22px;font-size:13px;line-height:1;cursor:pointer;padding:0;margin:0 auto;display:block;
  }
  .summary-block{border-top:2px solid var(--accent);}
  .sum-gap{height:22px;border-bottom:1px solid var(--line);}
  .sum-row{
    display:grid;
    grid-template-columns:1fr 200px;
    border-bottom:1px solid var(--line);
    align-items:center;
  }
  .sum-row .sum-label{padding:9px 22px;font-size:13.5px;font-weight:600;}
  .sum-row input{
    border:none;background:transparent;
    text-align:center;font-size:13.5px;font-weight:600;
    padding:9px 18px;width:100%;font-family:inherit;color:var(--ink);outline:none;
  }
  .sum-row input:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--accent);}
  .sum-row.total{background:var(--accent-soft);}
  .sum-row.total .sum-label{font-weight:800;}
  .sum-row.total input{font-weight:800;color:var(--accent);}
  .sum-item-amt{
    border:none;background:transparent;text-align:center;font-size:13.5px;font-weight:600;
    padding:9px 18px;width:100%;font-family:inherit;color:var(--ink);outline:none;
  }
  .sum-item-amt:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--accent);}
  .sum-del{
    background:rgba(20,40,60,.6);color:#fff;border:none;border-radius:50%;
    width:22px;height:22px;font-size:13px;line-height:1;cursor:pointer;padding:0;margin:0 auto;display:block;
  }
  .mth-title{
    background:var(--label-bg);
    font-weight:700;font-size:12px;letter-spacing:1px;
    padding:8px 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  }
  .mth-row{
    display:grid;
    grid-template-columns:1fr 160px 40px;
    border-bottom:1px solid var(--line);
    align-items:center;
  }
  .mth-row .mth-label{padding:9px 22px;font-size:13px;color:var(--ink);}
  .mth-row .mth-amt{
    text-align:center;font-size:13px;padding:9px 8px;color:var(--ink);font-weight:600;
  }
  .mth-row input.mth-amt{
    border:none;background:transparent;width:100%;font-family:inherit;outline:none;
  }
  .mth-row input.mth-amt:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--accent);}
  .mth-row .mth-del{
    background:rgba(20,40,60,.6);color:#fff;border:none;border-radius:50%;
    width:22px;height:22px;font-size:13px;line-height:1;cursor:pointer;padding:0;margin:0 auto;display:block;
  }
  .actions{
    display:flex;
    gap:10px;
    padding:18px 22px;
    border-top:1px solid var(--line);
    flex-wrap:wrap;
  }
  button{
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    padding:10px 20px;
    border-radius:5px;
    border:1px solid var(--accent);
    cursor:pointer;
    transition:.15s;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:#0c4a70;}
  .btn-ghost{background:#fff;color:var(--accent);}
  .btn-ghost:hover{background:var(--accent-soft);}
  .toolbar{
    max-width:640px;
    margin:0 auto 16px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:flex-end;
  }
  .sheet + .sheet{margin-top:28px;}
  .sheet-num{
    font-size:12px;
    color:var(--muted);
    font-weight:600;
    padding:0 22px 14px;
    text-align:center;
  }
  .pdf-area{
    border-top:1px solid var(--line);
    padding:14px 22px;
  }
  .pdf-label{
    font-weight:700;
    font-size:13px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:8px;
  }
  .pdf-drop{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .pdf-drop input[type=file]{
    font-size:13px;
    font-family:inherit;
  }
  .pdf-view{
    margin-top:12px;
    display:none;
  }
  .pdf-view embed{
    width:100%;
    height:520px;
    border:1px solid var(--line);
    border-radius:4px;
  }
  .pdf-name{
    font-size:12.5px;
    color:var(--accent);
    font-weight:600;
    margin-top:6px;
    display:none;
  }
  .photo-area{
    border-top:1px solid var(--line);
    padding:14px 22px;
  }
  .photo-label{
    font-weight:700;
    font-size:13px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:8px;
  }
  .photo-drop{
    border:1px dashed var(--line);
    border-radius:5px;
    padding:5px 10px;
    text-align:center;
    color:var(--muted);
    font-size:11px;
    cursor:pointer;
    transition:.15s;
  }
  .photo-drop:hover,.photo-drop.drag{
    border-color:var(--accent);
    background:var(--accent-soft);
    color:var(--accent);
  }
  .photo-grid{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:12px;
  }
  .photo-thumb{
    position:relative;
    width:100%;
  }
  .photo-thumb img{
    width:100%;
    border:1px solid var(--line);
    border-radius:4px;
    display:block;
    cursor:zoom-in;
  }
  .pdf-card{display:flex;align-items:center;gap:10px;padding:14px 16px;border:1px solid var(--line);border-radius:6px;background:#fff7ed;cursor:pointer;color:#9a3412}
  .pdf-card:hover{background:#ffedd5}
  .photo-remark{display:block;width:100%;box-sizing:border-box;margin-top:10px;min-height:44px;border:1px solid var(--line);border-radius:4px;padding:6px 8px;font:inherit;font-size:13px;resize:none;overflow:hidden;background:#fffef7}
  .agent-pick{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:#0f4c75;margin-right:6px}
  .agent-pick select{padding:7px 10px;border:1px solid #0f4c75;border-radius:6px;font:inherit;font-weight:800;color:#0f4c75;background:#fff;min-width:130px}
  .photo-thumb .del{
    position:absolute;
    top:6px;right:6px;
    background:rgba(20,40,60,.75);
    color:#fff;
    border:none;
    border-radius:50%;
    width:24px;height:24px;
    font-size:14px;
    line-height:1;
    cursor:pointer;
    padding:0;
  }
  #lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(10,20,30,.88);
    z-index:999;
    align-items:center;
    justify-content:center;
    padding:24px;
    cursor:zoom-out;
  }
  #lightbox img{
    max-width:100%;
    max-height:100%;
    border-radius:6px;
    box-shadow:0 8px 40px rgba(0,0,0,.5);
  }
  @media(max-width:520px){
    .row,.total-row{grid-template-columns:130px 1fr;}
    .price-head{grid-template-columns:130px 1fr 1fr;}
    .row .label,.price-head div{padding-left:12px;padding-right:8px;font-size:12px;}
  }
  @media print{
    body{background:#fff;padding:0;}
    .sheet{box-shadow:none;border:none;max-width:100%;}
    .sheet + .sheet{margin-top:0;page-break-before:always;}
    .toolbar,.actions{display:none;}
    .row input,.row select{background:transparent;box-shadow:none;}
    .photo-drop,.pdf-drop{display:none;}
    .photo-thumb .del{display:none;}
    .photo-remark{border:none;background:transparent;padding:2px 0;}
    .photo-thumb{width:100%;break-inside:avoid;}
    /* hide all delete buttons and Add item buttons in print */
    .del-item,.del-fixed,.sum-del,.mth-del,.btn-additem{display:none !important;}
    /* space after Customer Name (first row) before Car Detail */
    .sheet .row:first-of-type{border-bottom:14px solid #fff;}
    /* space between BALANCE and the LUCAS block */
    .fixed-deduct{border-top:14px solid #fff;}
  }
</style>
</head>
<body>

<div class="toolbar">
  <label class="agent-pick">AGENT
    <select id="qAgent" onchange="if(this.value==='__other__'){ const n=(prompt('Agent 名字：')||'').trim().toUpperCase(); if(n){ addAgentOpt(n); this.value=n; } else this.value=''; }"></select>
  </label>
  <button class="btn-primary" onclick="addSheet()">+ Add Page</button>
  <button class="btn-primary" onclick="document.getElementById('ciFile').click()" title="选 Excel 文件（.xlsx / .xls / .csv）→ 每部车自动开一页、自动输入。也可以把文件拖进来，或者在 Excel copy 几行按 Ctrl+V" style="background:#16a34a;border-color:#16a34a">📥 Import Excel</button>
  <button class="btn-primary" onclick="ocrOpen()" title="别人 send 的 Excel 截图（JPG / PNG）→ 自动读字 → 每部车自动开一页、自动输入" style="background:#7c3aed;border-color:#7c3aed">📷 Import 截图</button>
  <input type="file" id="ciFile" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" style="display:none" onchange="ciImportFile(this.files[0]); this.value=''">
  <button class="btn-primary" onclick="copyInfo(this)">Agent Copy</button>
  <button class="btn-primary" onclick="agentFinalCopy(this)">Agent Final Copy</button>
  <button class="btn-primary" onclick="finalCopy(this)">Final Copy</button>
  <button class="btn-primary" onclick="window.print()">Print / Save PDF</button>
  <button class="btn-primary" onclick="saveArchive()">💾 存档</button>
  <button class="btn-primary" onclick="openLoadArchive()">📂 读取存档</button>
  <button class="btn-ghost" onclick="location.reload()">Clear All</button>
</div>

<div id="sheets"></div>

<template id="sheetTpl">
<div class="sheet">
  <h1>CAR SALES QUOTATION</h1>

  <!-- CUSTOMER NAME -->
  <div class="row" style="border-top:none;">
    <div class="label">Customer Name</div>
    <div class="val"><input type="text" class="q-name"></div>
  </div>

  <!-- CAR DETAIL -->
  <div class="section-title">Car Detail</div>
  <div class="row">
    <div class="label">Plate No</div>
    <div class="val"><input type="text" class="q-plate"></div>
  </div>
  <div class="row">
    <div class="label">Brand</div>
    <div class="val">
      <select class="q-sel" onchange="onPick(this,'q-brand')">
        <option value=""></option>
        <option>BMW</option>
        <option>MAZDA</option>
        <option>HONDA</option>
        <option>PEUGEOT</option>
        <option>VELLFIRE</option>
        <option>TOYOTA</option>
        <option>SUBARU</option>
        <option value="__OTHER__">OTHER</option>
      </select>
      <input type="text" class="q-brand q-other" style="display:none" placeholder="Type brand" onblur="ifEmptyRestore(this,'q-brand')">
    </div>
  </div>
  <div class="row">
    <div class="label">Model</div>
    <div class="val"><input type="text" class="q-model"></div>
  </div>
  <div class="row">
    <div class="label">Year</div>
    <div class="val"><input type="text" class="q-year"></div>
  </div>

  <!-- LOAN -->
  <div class="section-title">Loan</div>
  <div class="row">
    <div class="label">Loan Amount (RM)</div>
    <div class="val"><input type="text" class="money" inputmode="decimal" onblur="fmtMoney(this)"></div>
  </div>
  <div class="row">
    <div class="label">Monthly Installment (RM)</div>
    <div class="val"><input type="text" class="money mth-inst" inputmode="decimal" oninput="syncMonthly()" onblur="fmtMoney(this);syncMonthly()"><input type="hidden" class="bank-fee"></div>
  </div>
  <div class="row">
    <div class="label">Tenure</div>
    <div class="val"><input type="text"></div>
  </div>
  <div class="row">
    <div class="label">Financing</div>
    <div class="val">
      <select class="q-sel" onchange="onPick(this,'q-financing')">
        <option value=""></option>
        <option>AEON</option>
        <option>CIMB</option>
        <option>AMB</option>
        <option>CHAILEASE</option>
        <option>X STAR</option>
        <option>PBB</option>
        <option>CARSOME</option>
        <option value="__OTHER__">OTHER</option>
      </select>
      <input type="text" class="q-financing q-other" style="display:none" placeholder="Type financing" onblur="ifEmptyRestore(this,'q-financing')">
    </div>
  </div>
  <div class="cb-strip">
    <div class="cb-cell">
      <div class="cb-head">Cashback (RM)</div>
      <input type="text" class="cb-total" inputmode="decimal" oninput="calcCashback(this)" onblur="fmtMoney(this);calcCashback(this)">
    </div>
    <div class="cb-cell">
      <div class="cb-head">Lucas</div>
      <input type="text" class="cb-lucas cb-deduct" inputmode="decimal" oninput="calcCashback(this)" onblur="fmtMoney(this);calcCashback(this)">
    </div>
    <div class="cb-cell">
      <div class="cb-head">3rd Party (7%)</div>
      <input type="text" class="cb-thirdparty" readonly>
    </div>
    <div class="cb-cell">
      <div class="cb-head">Refer Fees</div>
      <input type="text" class="cb-refer cb-deduct" inputmode="decimal" oninput="calcCashback(this)" onblur="fmtMoney(this);calcCashback(this)">
    </div>
    <div class="cb-cell bal">
      <div class="cb-head">Balance</div>
      <input type="text" class="cb-balance" readonly>
    </div>
  </div>

  <div class="photo-area">
    <div class="photo-label">Photos</div>
    <div class="photo-drop" onclick="this.nextElementSibling.click()">
      + Add photo / PDF (click or paste)
    </div>
    <input type="file" accept="image/*,application/pdf,.pdf" multiple style="display:none" onchange="addPhotos(this.files, this.closest('.photo-area')); this.value=''">
    <div class="photo-grid"></div>
    <textarea class="photo-remark area-remark" rows="2" placeholder="Remark…"></textarea>
  </div>

  <div class="actions">
    <button class="btn-ghost" onclick="removeSheet(this)">Remove this page</button>
  </div>
</div>
</template>

<template id="partATpl">
<div class="sheet fixed-page">
  <h1>CASH BACK</h1>

  <div class="bank-row">
    <div class="label">BANK TOTAL CASH BACK :</div>
    <input type="text" class="pa-bank" readonly>
  </div>

  <div class="part-title">PART A</div>

  <div class="pa-table">
    <div class="pa-head">Item</div>
    <div class="pa-head">LUCAS</div>
    <div class="pa-head">3RD PARTY<small>7%</small></div>
    <div class="pa-head">REFER FEES</div>

    <div class="cell-label"><input type="text" class="pa-item" oninput="this.dataset.edited=1"></div>
    <div class="pa-lucas-cell"><input type="text" class="pa-lucas" readonly></div>
    <div class="pa-third-cell"><input type="text" class="pa-third" readonly></div>
    <div class="pa-refer-cell"><input type="text" class="pa-refer" readonly></div>

    <div class="pa-total" style="grid-column:1 / 4;"><input type="text" value="BALANCE:" readonly style="text-align:left;font-weight:800;color:var(--ink);"></div>
    <div class="pa-total"><input type="text" class="pa-balance" readonly></div>
  </div>

  <div class="addon-block">
    <div class="fixed-deduct">
      <div class="addon-row" data-key="lucas2">
        <div class="addon-name" style="font-weight:600;">LUCAS</div>
        <input type="text" class="deduct-amt addon-amt" inputmode="decimal" oninput="calcFinal(this)" onblur="fmtMoney(this);calcFinal(this)">
        <button class="del-fixed" onclick="this.closest('.addon-row').remove();calcFinal(this)">×</button>
      </div>
      <div class="addon-row" data-key="agent">
        <div class="addon-name" style="font-weight:600;">AGENT</div>
        <input type="text" class="deduct-amt addon-amt" inputmode="decimal" oninput="calcFinal(this)" onblur="fmtMoney(this);calcFinal(this)">
        <button class="del-fixed" onclick="this.closest('.addon-row').remove();calcFinal(this)">×</button>
      </div>
    </div>

    <div class="mth-list"></div>

    <div class="pa-items"></div>

    <div style="padding:8px 22px;">
      <button class="btn-additem" onclick="addItem(this)">+ Add item</button>
    </div>

    <div class="addon-row final">
      <div class="addon-name" style="font-weight:800;">CUSTOMER BALANCE</div>
      <input type="text" class="pa-final addon-amt" readonly>
      <span class="addon-spacer"></span>
    </div>

    <div class="summary-block">
      <div class="sum-gap"></div>
      <div class="sum-row"><div class="sum-label">MONTHLY INSTALMENT :</div><input type="text" class="sum-mth" readonly></div>
      <div class="sum-row"><div class="sum-label">BANK FEE :</div><input type="text" class="sum-bankfee" readonly></div>
      <div class="sum-row"><div class="sum-label">CUS TAKEN :</div><input type="text" class="sum-cus" readonly></div>
      <div class="sum-row"><div class="sum-label">AGENT TAKE :</div><input type="text" class="sum-agent" readonly></div>
      <div class="sum-row"><div class="sum-label">LUCAS TAKEN :</div><input type="text" class="sum-lucas" readonly></div>
      <div class="sum-row"><div class="sum-label">3RD PARTY :</div><input type="text" class="sum-handling" readonly></div>
      <div class="sum-row"><div class="sum-label">REFER FEES :</div><input type="text" class="sum-refer" readonly></div>
      <div class="sum-items"></div>
      <div style="padding:8px 22px;"><button class="btn-additem" onclick="addSumItem(this)">+ Add item</button></div>
      <div class="sum-row total"><div class="sum-label">SUB TOTAL :</div><input type="text" class="sum-total" readonly></div>
    </div>
  </div>
</div>
</template>

<script>
  const container = document.getElementById('sheets');
  const tpl = document.getElementById('sheetTpl');
  const partATpl = document.getElementById('partATpl');

  function fixedPage(){ return container.querySelector('.fixed-page'); }

  function addSheet(){
    const node = tpl.content.cloneNode(true);
    const fp = fixedPage();
    if(fp) container.insertBefore(node, fp);
    else container.appendChild(node);
    renumber();
    const sheets = container.querySelectorAll('.sheet:not(.fixed-page)');
    const newSheet = sheets[sheets.length-1];
    // auto-fill customer name from the first page
    if(sheets.length > 1){
      const firstName = sheets[0].querySelector('.q-name');
      const newName = newSheet.querySelector('.q-name');
      if(firstName && newName) newName.value = firstName.value;
    }
    if(window.__ready){
      newSheet.scrollIntoView({behavior:'smooth', block:'start'});
    }
  }
  function copyInfo(btn){
    const pages = container.querySelectorAll('.sheet:not(.fixed-page)');
    if(!pages.length) return;
    const num = v => { const n = parseFloat(String(v).replace(/[^0-9.-]/g,'')); return isNaN(n)?0:n; };
    const fmt = n => n.toLocaleString('en-MY', {minimumFractionDigits:2, maximumFractionDigits:2});
    const gv = (sheet, cls) => { const el = sheet.querySelector('.'+cls); return el ? el.value.trim() : ''; };

    const lines = [];
    lines.push(gv(pages[0], 'q-name').toUpperCase());
    lines.push('');

    let total = 0;
    pages.forEach(s=>{
      const plate = gv(s,'q-plate').toUpperCase();
      const brand = gv(s,'q-brand').toUpperCase();
      const model = gv(s,'q-model').toUpperCase();
      const year  = gv(s,'q-year');
      const fin   = gv(s,'q-financing').toUpperCase();
      const bal   = gv(s,'cb-balance');
      lines.push(plate + ' - ' + brand);
      lines.push(model + ' ( ' + year + ' )');
      lines.push(fin + ' CASH BACK');
      lines.push('RM ' + (bal || '0.00'));
      lines.push('');
      total += num(bal);
    });
    lines.push('TOTAL CASH BACK : RM ' + fmt(total));

    const text = lines.join('\n');
    const done = ()=>{ const t=btn.textContent; btn.textContent='Copied!'; setTimeout(()=>btn.textContent=t,1500); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
    } else {
      fallbackCopy(text, done);
    }
  }
  function fallbackCopy(text, done){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){}
    document.body.removeChild(ta);
  }
  function addFixedPage(){
    container.appendChild(partATpl.content.cloneNode(true));
    renumber();
  }
  function removeSheet(btn){
    const sheet = btn.closest('.sheet');
    if(sheet.classList.contains('fixed-page')) return; // never remove the cashback page
    const quotes = container.querySelectorAll('.sheet:not(.fixed-page)');
    if(quotes.length <= 1) return; // keep at least one quotation page
    sheet.remove();
    renumber();
  }
  function renumber(){
    const sheets = container.querySelectorAll('.sheet');
    const quoteCount = container.querySelectorAll('.sheet:not(.fixed-page)').length;
    sheets.forEach((s,i)=>{
      if(s.classList.contains('fixed-page')) return; // no page number on cashback page
      let tag = s.querySelector('.sheet-num');
      if(!tag){
        tag = document.createElement('div');
        tag.className = 'sheet-num';
        s.appendChild(tag);
      }
      tag.textContent = 'Page ' + (i+1) + ' of ' + quoteCount;
    });
    // Cashback item follows the number of quotation pages: 1 page -> "1 CAR"
    const item = container.querySelector('.fixed-page .pa-item');
    if(item && !item.dataset.edited){
      item.value = quoteCount + ' CAR';
    }
    syncBankTotal();
    syncMonthly();
  }

  function syncMonthly(){
    const fp = container.querySelector('.fixed-page');
    if(!fp) return;
    const list = fp.querySelector('.mth-list');
    list.innerHTML = '';
    const pages = container.querySelectorAll('.sheet:not(.fixed-page)');
    pages.forEach((s, idx)=>{
      const inst = s.querySelector('.mth-inst');
      const val = inst ? inst.value.trim() : '';
      // Monthly installment row (display only)
      const row = document.createElement('div');
      row.className = 'mth-row';
      const label = document.createElement('div');
      label.className = 'mth-label';
      label.textContent = (idx+1) + ' CAR MONTHLY INSTALLMENT';
      const amt = document.createElement('div');
      amt.className = 'mth-amt';
      amt.textContent = val || '0.00';
      const del = document.createElement('button');
      del.className = 'mth-del';
      del.textContent = '×';
      del.onclick = ()=>{ if(inst){ inst.value=''; syncMonthly(); } };
      row.appendChild(label); row.appendChild(amt); row.appendChild(del);
      list.appendChild(row);

      // Bank fees row (editable, stored on the page's hidden .bank-fee)
      const store = s.querySelector('.bank-fee');
      const brow = document.createElement('div');
      brow.className = 'mth-row';
      const blabel = document.createElement('div');
      blabel.className = 'mth-label';
      blabel.textContent = (idx+1) + ' CAR BANK FEES';
      const bamt = document.createElement('input');
      bamt.type = 'text'; bamt.className = 'mth-amt bank-input'; bamt.inputMode = 'decimal';
      bamt.value = store ? store.value : '';
      bamt.oninput = ()=>{ if(store) store.value = bamt.value; calcFinal(fp.querySelector('.pa-final')); };
      bamt.onblur = ()=>{ fmtMoney(bamt); if(store) store.value = bamt.value; calcFinal(fp.querySelector('.pa-final')); };
      const bdel = document.createElement('button');
      bdel.className = 'mth-del';
      bdel.textContent = '×';
      bdel.onclick = ()=>{ if(store) store.value=''; bamt.value=''; calcFinal(fp.querySelector('.pa-final')); };
      brow.appendChild(blabel); brow.appendChild(bamt); brow.appendChild(bdel);
      list.appendChild(brow);
    });
    calcFinal(fp.querySelector('.pa-final'));
  }

  function fmtMoney(el){
    const raw = String(el.value).replace(/[^0-9.-]/g,'');
    if(raw === '' ){ el.value=''; return; }
    const n = parseFloat(raw);
    if(isNaN(n)){ el.value=''; return; }
    el.value = n.toLocaleString('en-MY', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function syncBankTotal(){
    const num = v => { const n = parseFloat(String(v).replace(/[^0-9.-]/g,'')); return isNaN(n)?0:n; };
    const fmt = n => n.toLocaleString('en-MY', {minimumFractionDigits:2, maximumFractionDigits:2});
    let bankSum=0, lucasSum=0, thirdSum=0, referSum=0;
    container.querySelectorAll('.sheet:not(.fixed-page)').forEach(s=>{
      bankSum  += num(s.querySelector('.cb-total') ? s.querySelector('.cb-total').value : 0);
      lucasSum += num(s.querySelector('.cb-lucas') ? s.querySelector('.cb-lucas').value : 0);
      thirdSum += num(s.querySelector('.cb-thirdparty') ? s.querySelector('.cb-thirdparty').value : 0);
      referSum += num(s.querySelector('.cb-refer') ? s.querySelector('.cb-refer').value : 0);
    });
    const fp = container.querySelector('.fixed-page');
    if(!fp) return;
    fp.querySelector('.pa-bank').value  = bankSum  ? fmt(bankSum)  : '';
    fp.querySelector('.pa-lucas').value = lucasSum ? fmt(lucasSum) : '';
    fp.querySelector('.pa-third').value = thirdSum ? fmt(thirdSum) : '';
    fp.querySelector('.pa-refer').value = referSum ? fmt(referSum) : '';
    const balance = bankSum - lucasSum - thirdSum - referSum;
    fp.querySelector('.pa-balance').value = bankSum ? fmt(balance) : '';
    calcFinal(fp.querySelector('.pa-final'));
  }

  function calcFinal(el){
    const fp = el.closest('.fixed-page') || container.querySelector('.fixed-page');
    if(!fp) return;
    const num = v => { const n = parseFloat(String(v).replace(/[^0-9.-]/g,'')); return isNaN(n)?0:n; };
    const fmt = n => n.toLocaleString('en-MY', {minimumFractionDigits:2, maximumFractionDigits:2});
    const balance = num(fp.querySelector('.pa-balance').value);
    let deduct = 0;
    fp.querySelectorAll('.deduct-amt').forEach(i=> deduct += num(i.value));
    fp.querySelectorAll('.pa-items .item-amt').forEach(i=> deduct += num(i.value));
    container.querySelectorAll('.sheet:not(.fixed-page) .mth-inst').forEach(i=> deduct += num(i.value));
    container.querySelectorAll('.sheet:not(.fixed-page) .bank-fee').forEach(i=> deduct += num(i.value));
    const hasBalance = fp.querySelector('.pa-balance').value !== '';
    fp.querySelector('.pa-final').value = hasBalance ? fmt(balance - deduct) : '';
    calcSummary(fp.querySelector('.sum-company'));
  }

  function calcSummary(el){
    const fp = (el && el.closest('.fixed-page')) || container.querySelector('.fixed-page');
    if(!fp) return;
    const num = v => { const n = parseFloat(String(v).replace(/[^0-9.-]/g,'')); return isNaN(n)?0:n; };
    const fmt = n => n.toLocaleString('en-MY', {minimumFractionDigits:2, maximumFractionDigits:2});
    // auto-fed rows
    let mth = 0;
    container.querySelectorAll('.sheet:not(.fixed-page) .mth-inst').forEach(i=> mth += num(i.value));
    let bankfee = 0;
    container.querySelectorAll('.sheet:not(.fixed-page) .bank-fee').forEach(i=> bankfee += num(i.value));
    const cus     = num(fp.querySelector('.pa-final').value);      // CUSTOMER BALANCE
    const agentRow = fp.querySelector('.addon-row[data-key="agent"] .deduct-amt');
    const lucasRow = fp.querySelector('.addon-row[data-key="lucas2"] .deduct-amt');
    const agent   = num(agentRow ? agentRow.value : 0); // AGENT
    const lucas   = num(fp.querySelector('.pa-lucas').value) + num(lucasRow ? lucasRow.value : 0); // PART A LUCAS + manual LUCAS
    const handling= num(fp.querySelector('.pa-third').value);      // 3RD PARTY 7%
    const refer   = num(fp.querySelector('.pa-refer').value);      // REFER FEES

    fp.querySelector('.sum-mth').value      = fmt(mth);
    fp.querySelector('.sum-bankfee').value  = fmt(bankfee);
    fp.querySelector('.sum-cus').value      = fmt(cus);
    fp.querySelector('.sum-agent').value    = fmt(agent);
    fp.querySelector('.sum-lucas').value    = fmt(lucas);
    fp.querySelector('.sum-handling').value = fmt(handling);
    fp.querySelector('.sum-refer').value    = fmt(refer);

    let extra = 0;
    fp.querySelectorAll('.sum-items .sum-item-amt').forEach(i=> extra += num(i.value));

    const subtotal = mth + bankfee + cus + agent + lucas + handling + refer + extra;
    fp.querySelector('.sum-total').value = fmt(subtotal);
  }

  function makeSumRow(fp){
    const wrap = fp.querySelector('.sum-items');
    const row = document.createElement('div');
    row.className = 'sum-row';
    const name = document.createElement('input');
    name.type = 'text'; name.className = 'sum-item-name';
    name.style.cssText = 'text-align:left;font-weight:600;';
    const amt = document.createElement('input');
    amt.type = 'text'; amt.className = 'sum-item-amt'; amt.inputMode = 'decimal';
    amt.oninput = ()=>calcSummary(amt);
    amt.onblur = ()=>{ fmtMoney(amt); calcSummary(amt); };
    const del = document.createElement('button');
    del.className = 'sum-del'; del.textContent = '×';
    row.style.gridTemplateColumns = '1fr 160px 40px';
    name.style.padding = '9px 22px'; name.style.border='none'; name.style.background='transparent';
    name.style.fontFamily='inherit'; name.style.color='var(--ink)'; name.style.outline='none'; name.style.width='100%';
    row.appendChild(name); row.appendChild(amt); row.appendChild(del);
    wrap.appendChild(row);
    return {row, name, amt, del};
  }

  function addSumItem(btn){
    const fp = btn.closest('.fixed-page');
    const b = makeSumRow(fp);
    b.del.onclick = ()=>{ b.row.remove(); calcSummary(fp.querySelector('.sum-total')); };
  }

  function addItem(btn){
    const fp = btn.closest('.fixed-page');
    const wrap = fp.querySelector('.pa-items');
    const row = document.createElement('div');
    row.className = 'addon-row';
    const name = document.createElement('input');
    name.type = 'text'; name.className = 'item-name';
    const amt = document.createElement('input');
    amt.type = 'text'; amt.className = 'item-amt addon-amt'; amt.inputMode = 'decimal';
    const del = document.createElement('button');
    del.className = 'del-item'; del.textContent = '×';

    // paired row in the CUSTOMER BALANCE summary block
    const b = makeSumRow(fp);

    // mark bottom amount as manually edited once user types in it
    b.amt.addEventListener('input', ()=>{ b.amt.dataset.edited = '1'; });

    // sync name top -> bottom
    name.oninput = ()=>{ b.name.value = name.value; };
    // amount: affects own total, and mirrors to bottom unless bottom was edited
    amt.oninput = ()=>{
      if(!b.amt.dataset.edited){ b.amt.value = amt.value; calcSummary(b.amt); }
      calcFinal(amt);
    };
    amt.onblur = ()=>{
      fmtMoney(amt);
      if(!b.amt.dataset.edited){ b.amt.value = amt.value; calcSummary(b.amt); }
      calcFinal(amt);
    };

    // deleting either side removes both
    const removeBoth = ()=>{ row.remove(); b.row.remove(); calcFinal(fp.querySelector('.pa-final')); calcSummary(fp.querySelector('.sum-total')); };
    del.onclick = removeBoth;
    b.del.onclick = removeBoth;

    row.appendChild(name); row.appendChild(amt); row.appendChild(del);
    wrap.appendChild(row);
  }

  function calcCashback(el){
    const sheet = el.closest('.sheet');
    const num = v => { const n = parseFloat(String(v).replace(/[^0-9.-]/g,'')); return isNaN(n)?0:n; };
    const fmt = n => n.toLocaleString('en-MY', {minimumFractionDigits:2, maximumFractionDigits:2});
    const total = num(sheet.querySelector('.cb-total').value);

    // 3rd Party = 7% of cashback
    const thirdParty = total * 0.07;
    sheet.querySelector('.cb-thirdparty').value = total ? fmt(thirdParty) : '';

    // manual deductions (Lucas + Refer Fees)
    let deduct = thirdParty;
    sheet.querySelectorAll('.cb-deduct').forEach(d=> deduct += num(d.value));

    const bal = total - deduct;
    sheet.querySelector('.cb-balance').value = total ? fmt(bal) : '';
    syncBankTotal();
  }

  function agentFinalCopy(btn){
    const pages = container.querySelectorAll('.sheet:not(.fixed-page)');
    if(!pages.length) return;
    const fp = container.querySelector('.fixed-page');
    const fmt = n => n.toLocaleString('en-MY', {minimumFractionDigits:2, maximumFractionDigits:2});
    const gv = (s, cls) => { const el = s.querySelector('.'+cls); return el ? el.value.trim() : ''; };
    const rm = v => 'RM ' + (v && v.trim() ? v.trim() : fmt(0));
    const carLine = s => (gv(s,'q-plate').toUpperCase() + ' - ' + gv(s,'q-brand').toUpperCase());
    const L = [];

    L.push(gv(pages[0],'q-name').toUpperCase());
    L.push('');
    pages.forEach(s=>{
      L.push(carLine(s));
      L.push(': ' + rm(gv(s,'cb-balance')));
      L.push('');
    });
    L.push('----------------------------------------------------');
    L.push('');
    const agentManual = (fp.querySelector('.addon-row[data-key="agent"] .deduct-amt')||{}).value || '';
    const lucasManual = (fp.querySelector('.addon-row[data-key="lucas2"] .deduct-amt')||{}).value || '';
    L.push('AGENT DEALER ');
    L.push(rm(agentManual));
    L.push('');
    L.push('LUCAS DEALER');
    L.push(rm(lucasManual));
    L.push('');
    pages.forEach(s=>{
      L.push('MONTHLY INSTALMENT - ' + rm(gv(s,'mth-inst')));
      L.push('BANK FEE - ' + rm(gv(s,'bank-fee')));
    });
    fp.querySelectorAll('.pa-items .addon-row').forEach(r=>{
      const nm = ((r.querySelector('.item-name')||{}).value || '').toUpperCase();
      const am = (r.querySelector('.item-amt')||{}).value || '';
      if(nm || am) L.push((nm||'ITEM') + ' - ' + rm(am));
    });
    L.push('');
    L.push('CUSTOMER BALANCE : ' + rm(gv(fp,'pa-final')));

    const text = L.join('\n').toUpperCase();
    const done = ()=>{ const t=btn.textContent; btn.textContent='Copied!'; setTimeout(()=>btn.textContent=t,1500); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
    } else { fallbackCopy(text, done); }
  }

  function finalCopy(btn){
    const pages = container.querySelectorAll('.sheet:not(.fixed-page)');
    if(!pages.length) return;
    const fp = container.querySelector('.fixed-page');
    const num = v => { const n = parseFloat(String(v).replace(/[^0-9.-]/g,'')); return isNaN(n)?0:n; };
    const fmt = n => n.toLocaleString('en-MY', {minimumFractionDigits:2, maximumFractionDigits:2});
    const gv = (s, cls) => { const el = s.querySelector('.'+cls); return el ? el.value.trim() : ''; };
    const rm = v => 'RM ' + (v && v.trim() ? v.trim() : fmt(0));
    const carLine = s => (gv(s,'q-plate').toUpperCase() + ' - ' + gv(s,'q-brand').toUpperCase());
    const L = [];

    const custName = gv(pages[0],'q-name').toUpperCase();
    L.push('*' + custName + '*');
    L.push('');
    L.push('------------------------------------------------');
    L.push('*Dealer Cash Back*');
    L.push('');

    let totalCB = 0;
    pages.forEach(s=>{
      const cb = gv(s,'cb-total');
      L.push(carLine(s));
      L.push(': ' + rm(cb));
      L.push('');
      totalCB += num(cb);
    });
    L.push('*TOTAL CASH BACK : RM ' + fmt(totalCB) + '*');
    L.push('');
    L.push('Lucas : ' + rm(gv(fp,'pa-lucas')));
    L.push('3rd PARTY : ' + rm(gv(fp,'pa-third')));
    L.push('REFER FEE : ' + rm(gv(fp,'pa-refer')));
    L.push('');
    L.push('*BALANCE CASH BACK : ' + rm(gv(fp,'pa-balance')) + '*');
    L.push('');
    L.push('-----------------------------------------------------------------------');
    L.push('*Lucas Dealer*');
    L.push('');
    pages.forEach(s=>{
      L.push(carLine(s));
      L.push(': ' + rm(gv(s,'cb-balance')));
      L.push('');
    });
    L.push('----------------------------------------------------');

    const agentManual = (fp.querySelector('.addon-row[data-key="agent"] .deduct-amt')||{}).value || '';
    const lucasManual = (fp.querySelector('.addon-row[data-key="lucas2"] .deduct-amt')||{}).value || '';
    L.push('AGENT Dealer ');
    L.push(rm(agentManual));
    L.push('');
    L.push('Lucas Dealer');
    L.push(rm(lucasManual));
    L.push('');
    pages.forEach(s=>{
      L.push('MONTHLY INSTALMENT - ' + rm(gv(s,'mth-inst')));
      L.push('BANK FEE - ' + rm(gv(s,'bank-fee')));
    });
    fp.querySelectorAll('.pa-items .addon-row').forEach(r=>{
      const nm = ((r.querySelector('.item-name')||{}).value || '').toUpperCase();
      const am = (r.querySelector('.item-amt')||{}).value || '';
      if(nm || am) L.push((nm||'ITEM') + ' - ' + rm(am));
    });
    L.push('');
    L.push('*CUSTOMER BALANCE : ' + rm(gv(fp,'pa-final')) + '*');
    L.push('');
    L.push('----------------------------------------------------');
    L.push('_*FINAL DETAIL*_');
    L.push('');
    L.push('_*MONTHLY INSTALMENT : ' + rm(gv(fp,'sum-mth')) + '*_');

  /* Agent 选单：名单跟 CRM 的 Closing Agent 一样 */
  const AGENT_FALLBACK = ["alex","steven","vick","fin","candy","edward","nico","anna","gary","darren","davis","celement","br","ivan","kelvin","lee","nick","william","da sheng","bosco","loki","jimmy","elwin","caden","joe","tom","angeline"];
  function addAgentOpt(n){ const sel = document.getElementById('qAgent'); if(!sel || !n) return; n = String(n).toUpperCase(); if([...sel.options].some(o=>o.value===n)) return; const o = document.createElement('option'); o.value = n; o.textContent = n; sel.insertBefore(o, sel.querySelector('option[value="__other__"]')); }
  (function initAgents(){ const sel = document.getElementById('qAgent'); if(!sel) return;
    let list = AGENT_FALLBACK; try{ if(window.parent && window.parent !== window && Array.isArray(window.parent.CLOSING_AGENTS)) list = window.parent.CLOSING_AGENTS; }catch(e){}
    sel.innerHTML = '<option value="">— 选择 —</option>' + list.map(a=>'<option value="'+String(a).toUpperCase()+'">'+String(a).toUpperCase()+'</option>').join('') + '<option value="__other__">＋ 其他…</option>'; })();
  /* ===== 从 Excel / Google Sheet 自动输入：📥 Import Excel、把 .xlsx 拖进来、或者 copy 几行按 Ctrl+V ===== */
  const CI_BRANDS = ['MERCEDES-BENZ','MERCEDES BENZ','MERCEDES','LAND ROVER','RANGE ROVER','ALFA ROMEO','ASTON MARTIN','ROLLS-ROYCE','ROLLS ROYCE','TOYOTA','HONDA','PROTON','PERODUA','NISSAN','MAZDA','MITSUBISHI','BMW','AUDI','VOLKSWAGEN','VW','LEXUS','SUBARU','PEUGEOT','KIA','HYUNDAI','FORD','ISUZU','VOLVO','PORSCHE','MINI','TESLA','BYD','CHERY','HAVAL','GWM','ORA','JAGUAR','SUZUKI','DAIHATSU','CHEVROLET','RENAULT','CITROEN','INFINITI','FERRARI','LAMBORGHINI','BENTLEY','MASERATI','JAECOO','OMODA','ZEEKR','SMART','DENZA','MG','GEELY','PROTON EV','NAZA','INOKOM'];
  const CI_FIN = [['CHAILEASE',/^CHAIL/],['CARSOME',/^CARSO[MN]E/],['AMB',/^(AMB|AMBANK|AM BANK)$/],['X STAR',/^X\s*-?\s*STAR/],['AEON',/^AEON/],['CIMB',/^CIMB/],['PBB',/^(PBB|PUBLIC)/]];
  const CI_COLORS = /^(WHITE|BLACK|SILVER|GREY|GRAY|RED|BLUE|GREEN|YELLOW|ORANGE|BROWN|GOLD|BEIGE|PURPLE|MAROON|BRONZE|PEARL WHITE|CHAMPAGNE|DARK GREY|DARK BLUE|PINK)$/i;
  const ciNum = v => { if(typeof v === 'number') return v; const s = String(v==null?'':v).replace(/[,\sRM]/gi,''); return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : null; };
  const ciPlate = s => /^[A-Z]{1,4}\s?\d{1,4}\s?[A-Z]{0,2}(\s*\/\s*[A-Z]{1,4}\s?\d{1,4}\s?[A-Z]{0,2})*$/i.test(String(s).trim()) && /\d/.test(s);
  function ciParseRows(rows){
    const cars = []; let custName = '';
    rows.forEach(r => {
      const cells = (r||[]).map(v => v==null ? '' : (typeof v === 'number' ? v : String(v).trim())).filter(v => v !== '');
      if(!cells.length) return;
      let i = cells.findIndex(v => typeof v === 'string' && ciPlate(v));
      if(i < 0){ if(cells.length === 1 && typeof cells[0] === 'string' && /[A-Z]/i.test(cells[0]) && !custName) custName = cells[0]; return; }
      if(i > 0 && typeof cells[i-1] === 'string' && !custName) custName = cells[i-1];
      const car = { plate: String(cells[i]).toUpperCase().replace(/\s*\/\s*/g,'/') }; i++;
      const rest = cells.slice(i);
      /* brand + model */
      let k = 0; const first = typeof rest[0] === 'string' ? rest[0].toUpperCase() : '';
      const br = CI_BRANDS.find(b => first === b || first.startsWith(b + ' '));
      if(br){ car.brand = br === 'MERCEDES BENZ' || br === 'MERCEDES' ? 'MERCEDES-BENZ' : br === 'VW' ? 'VOLKSWAGEN' : br; const m = first.slice(br.length).trim(); k = 1;
        if(m) car.model = m; else if(typeof rest[1] === 'string' && ciNum(rest[1]) == null){ car.model = rest[1].toUpperCase(); k = 2; } }
      else if(first && ciNum(first) == null){ car.brand = first; k = 1; if(typeof rest[1] === 'string' && ciNum(rest[1]) == null){ car.model = rest[1].toUpperCase(); k = 2; } }
      /* year → cc → A/M → 颜色 → 「名字 - Financing」→ 4 个数目 */
      const nums = []; let finTxt = '';
      for(let j = k; j < rest.length; j++){
        const v = rest[j], n = ciNum(v);
        if(n != null){
          if(!car.year && Number.isInteger(n) && n >= 1980 && n <= 2040 && !finTxt) { car.year = String(n); continue; }
          if(!finTxt && n > 0 && n < 10) { car.cc = n; continue; }
          if(finTxt || nums.length || n >= 100) nums.push(n);
          continue;
        }
        const s = String(v).toUpperCase();
        if(!finTxt && /^(A|M|AT|MT|AUTO|MANUAL)$/.test(s)) { car.trans = s; continue; }
        if(!finTxt && CI_COLORS.test(s)) { car.color = s; continue; }
        if(!finTxt) finTxt = s;
      }
      car.finTxt = finTxt;
      [car.loan, car.cb, car.mthly, car.tenure] = [nums[0], nums[1], nums[2], nums[3]];
      cars.push(car);
    });
    /* 客户名字：没有的话用「名字 - Financing」前面一样的字 */
    const fins = cars.map(c => c.finTxt).filter(Boolean);
    if(!custName && fins.length){
      if(fins.length > 1){ const w = fins.map(f => f.replace(/\s*-\s*/g,' ').split(/\s+/)); let n = 0; while(w.every(x => x[n] && x[n] === w[0][n]) && n < w[0].length - 1) n++; custName = w[0].slice(0,n).join(' '); }
      else if(/\s-\s/.test(fins[0])) custName = fins[0].split(/\s-\s/)[0];
    }
    custName = String(custName||'').toUpperCase().trim();
    cars.forEach(c => { let f = c.finTxt || '';
      if(custName && f.startsWith(custName)) f = f.slice(custName.length);
      else if(/\s-\s/.test(f)) f = f.split(/\s-\s/).slice(1).join(' - ');
      f = f.replace(/^[\s\-–:]+/,'').trim();
      const hit = CI_FIN.find(([, re]) => re.test(f)); c.fin = hit ? hit[0] : f; });
    return { name: custName, cars };
  }
  function ciSetPick(sheet, cls, val){
    const txt = sheet.querySelector('.'+cls); if(!txt) return; const sel = txt.parentElement.querySelector('.q-sel');
    val = String(val||'').toUpperCase();
    if(sel && val && [...sel.options].some(o => o.value === val)){ sel.value = val; sel.style.display = ''; txt.style.display = 'none'; txt.value = val; }
    else if(sel && val){ sel.style.display = 'none'; txt.style.display = ''; txt.value = val; }
  }
  function ciRowInput(sheet, label){ const row = [...sheet.querySelectorAll('.row')].find(r => { const l = r.querySelector('.label'); return l && l.textContent.trim().toLowerCase().startsWith(label); }); return row && row.querySelector('.val input:not([type=hidden])'); }
  const ciMoney = n => n == null ? '' : Number(n).toLocaleString('en-MY', {minimumFractionDigits:2, maximumFractionDigits:2});
  function ciFill(data){
    if(!data.cars.length){ alert('找不到车的资料 — 要有车牌（例如 JRC8088）那一行'); return; }
    let sheets = [...container.querySelectorAll('.sheet:not(.fixed-page)')];
    const isEmpty = s => !s.querySelector('.q-plate').value.trim() && !(s.querySelector('input.money') || {}).value;
    let free = sheets.filter(isEmpty);
    data.cars.forEach(c => {
      let s = free.shift();
      if(!s){ addSheet(); const all = container.querySelectorAll('.sheet:not(.fixed-page)'); s = all[all.length-1]; }
      const set = (el, v) => { if(el && v != null && v !== ''){ el.value = v; el.dispatchEvent(new Event('input', {bubbles:true})); el.dispatchEvent(new Event('change', {bubbles:true})); } };
      if(data.name) set(s.querySelector('.q-name'), data.name);
      set(s.querySelector('.q-plate'), c.plate);
      ciSetPick(s, 'q-brand', c.brand);
      set(s.querySelector('.q-model'), c.model);
      set(s.querySelector('.q-year'), c.year);
      set(ciRowInput(s, 'loan amount'), ciMoney(c.loan));
      set(s.querySelector('.mth-inst'), ciMoney(c.mthly));
      set(ciRowInput(s, 'tenure'), c.tenure != null ? String(c.tenure) : '');
      ciSetPick(s, 'q-financing', c.fin);
      const cb = s.querySelector('.cb-total'); set(cb, ciMoney(c.cb)); if(cb) calcCashback(cb);
    });
    try{ syncMonthly(); }catch(e){}
    renumber();
    const msg = document.createElement('div');
    msg.textContent = '✓ 已自动输入 ' + data.cars.length + ' 部车' + (data.name ? '（' + data.name + '）' : '') + ' — 请检查一下数目';
    msg.style.cssText = 'position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;z-index:99999;box-shadow:0 6px 20px rgba(0,0,0,.2);font-family:inherit';
    document.body.appendChild(msg); setTimeout(() => msg.remove(), 4000);
  }
  function ciLoadXlsx(){ return window.XLSX ? Promise.resolve(window.XLSX) : new Promise((ok, bad) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; sc.onload = () => ok(window.XLSX); sc.onerror = () => bad(new Error('load')); document.head.appendChild(sc); }); }
  async function ciImportFile(f){
    if(!f) return;
    try{
      if(/\.csv$/i.test(f.name) || f.type === 'text/csv'){ const tx = await f.text(); ciFill(ciParseRows(tx.split(/\r?\n/).map(l => l.split(/,|\t/)))); return; }
      const X = await ciLoadXlsx(); const wb = X.read(await f.arrayBuffer(), {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]]; ciFill(ciParseRows(X.utils.sheet_to_json(ws, {header:1, raw:true, defval:''})));
    }catch(e){ alert('读不到这个文件：' + f.name + '\n请用 .xlsx / .xls / .csv'); }
  }
  document.addEventListener('paste', e => {
    const tx = e.clipboardData && e.clipboardData.getData('text/plain'); if(!tx || (tx.match(/\t/g) || []).length < 3) return;
    const rows = tx.replace(/\r/g,'').split('\n').map(l => l.split('\t'));
    const data = ciParseRows(rows); if(!data.cars.length) return;
    e.preventDefault(); e.stopImmediatePropagation(); ciFill(data);
  }, true);
  document.addEventListener('dragover', e => { const f = e.dataTransfer && [...(e.dataTransfer.items||[])].some(i => /sheet|excel|csv/i.test(i.type)); if(f && !e.target.closest('.photo-drop')) e.preventDefault(); });
  document.addEventListener('drop', e => { if(e.target.closest('.photo-drop')) return; const f = e.dataTransfer && [...(e.dataTransfer.files||[])].find(x => /\.(xlsx|xls|csv)$/i.test(x.name)); if(f){ e.preventDefault(); ciImportFile(f); } });

  /* ===== 📷 Import 截图：JPG / PNG（Excel 截图）→ 浏览器自己读字（Tesseract）→ 跟 Import Excel 一样自动输入 ===== */
  function ocrLoad(){ return window.Tesseract ? Promise.resolve(window.Tesseract) : new Promise((ok, bad) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'; sc.onload = () => ok(window.Tesseract); sc.onerror = () => bad(new Error('load')); document.head.appendChild(sc); }); }
  function ocrToast(t, keep){ let d = document.getElementById('ocrToast'); if(!d){ d = document.createElement('div'); d.id = 'ocrToast'; d.style.cssText = 'position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#7c3aed;color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;z-index:99999;box-shadow:0 6px 20px rgba(0,0,0,.2);font-family:inherit;text-transform:none'; document.body.appendChild(d); } d.textContent = t; clearTimeout(d._t); if(!keep) d._t = setTimeout(() => d.remove(), 4000); }
  /* 放大 2 倍 + 黑白，字比较读得准 */
  function ocrPrep(file){ return new Promise((ok, bad) => { const img = new Image(); img.onload = () => { const k = img.width < 2400 ? 2 : 1, c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k; const x = c.getContext('2d'); x.imageSmoothingEnabled = true; x.drawImage(img, 0, 0, c.width, c.height);
      const d = x.getImageData(0, 0, c.width, c.height), a = d.data; for(let i = 0; i < a.length; i += 4){ const g = 0.299*a[i] + 0.587*a[i+1] + 0.114*a[i+2]; a[i] = a[i+1] = a[i+2] = g; } x.putImageData(d, 0, 0); URL.revokeObjectURL(img.src); ok(c); }; img.onerror = bad; img.src = URL.createObjectURL(file); }); }
  /* 读到的字 → 一行一行、一格一格（字跟字隔很远 = 下一格） */
  function ocrRows(words){
    words = words.filter(w => w && w.text && w.text.trim() && w.bbox).map(w => ({ t: w.text.trim(), x0: w.bbox.x0, x1: w.bbox.x1, y0: w.bbox.y0, y1: w.bbox.y1, cy: (w.bbox.y0 + w.bbox.y1) / 2, h: w.bbox.y1 - w.bbox.y0 }));
    if(!words.length) return [];
    const hs = words.map(w => w.h).sort((a, b) => a - b), H = hs[Math.floor(hs.length / 2)] || 10;
    words.sort((a, b) => a.cy - b.cy); const lines = [];
    words.forEach(w => { const L = lines.find(l => Math.abs(l.cy - w.cy) < H * 0.6); if(L){ L.w.push(w); L.cy = (L.cy * (L.w.length - 1) + w.cy) / L.w.length; } else lines.push({ cy: w.cy, w: [w] }); });
    lines.sort((a, b) => a.cy - b.cy);
    return lines.map(l => { const ws = l.w.sort((a, b) => a.x0 - b.x0), cells = []; let cur = null, last = null;
      ws.forEach(w => { if(cur && w.x0 - last.x1 < H * 1.1) cur.push(w.t); else { cur = [w.t]; cells.push(cur); } last = w; });
      return cells.map(c => { let v = c.join(' ').replace(/[|\[\]{}“”"‘’]/g, '').trim();
          if(/^[A-Z]{1,4}\s?\d{1,4}[A-Z]{0,1}\)$/i.test(v)) v = v.slice(0, -1) + 'J';   /* 车牌最后的 J 常常读成 ) */
          return v.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9%.]+$/g, '').trim(); }).filter(c => c && /[A-Za-z0-9]/.test(c) && !(c.length === 1 && !/^[AM0-9]$/i.test(c))); });
  }
  /* 颜色格子读出来的乱字（例如 VHIT）拿掉：A / M 后面的字，只留 Financing 那一格 */
  const OCR_FIN = /(CIMB|GFS|AMB|AM\s*BANK|CHAIL|CARSO|X\s*-?\s*STAR|AEON|PBB|PUBLIC|MAYBANK|MBB|HLB|HONG\s*LEONG|RHB|AFFIN|BSN|ALLIANCE|MUAMALAT|JAECOO|CREDIT)/i;
  function ocrClean(row){
    const ti = row.findIndex(c => /^(A|M|AT|MT|AUTO|MANUAL)$/i.test(c)); if(ti < 0) return row;
    const strs = []; row.forEach((c, i) => { if(i > ti && ciNum(c) == null && !CI_COLORS.test(c)) strs.push(i); });
    if(strs.length <= 1) return row;
    const keep = strs.find(i => OCR_FIN.test(row[i])) ?? strs.reduce((a, b) => row[b].length > row[a].length ? b : a);
    return row.filter((c, i) => !strs.includes(i) || i === keep);
  }
  /* 自动核对：截图最后面的总数（车下面那几行的数目）要等于读到的 LOAN / CB / MONTHLY 加起来 */
  function ocrCheck(rows, data){
    const sum = { loan: 0, cb: 0, mthly: 0 }; data.cars.forEach(c => { sum.loan += c.loan || 0; sum.cb += c.cb || 0; sum.mthly += c.mthly || 0; });
    let last = -1; rows.forEach((r, i) => { if(r.some(v => typeof v === 'string' && ciPlate(v))) last = i; });
    const tots = []; rows.slice(last + 1).forEach(r => r.forEach(v => { const n = ciNum(v); if(n != null && n >= 100) tots.push(n); }));
    const near = (a, b) => Math.abs(a - b) < 0.5, S = [sum.loan, sum.cb, sum.mthly], ok = [], bad = [];
    tots.forEach(n => (S.some(x => near(x, n)) ? ok : bad).push(n));
    return { sum, ok, bad };
  }
  async function ocrImport(file){
    if(!file || !(file.type || '').startsWith('image/')){ alert('请用 JPG / PNG 截图'); return; }
    const m = document.getElementById('ocrModal'); if(m) m.remove();
    ocrToast('📷 读取截图中…（第一次要下载读字工具，会慢一点）', true);
    try{
      const T = await ocrLoad(), cv = await ocrPrep(file);
      const r = await T.recognize(cv, 'eng', { logger: x => { if(x && x.status === 'recognizing text') ocrToast('📷 读取中… ' + Math.round((x.progress || 0) * 100) + '%', true); } });
      let words = (r && r.data && r.data.words) || []; if(!words.length) ((r && r.data && r.data.blocks) || []).forEach(b => (b.paragraphs || []).forEach(p => (p.lines || []).forEach(l => (l.words || []).forEach(w => words.push(w)))));
      const rows = ocrRows(words).map(ocrClean);
      const data = ciParseRows(rows);
      const t = document.getElementById('ocrToast'); if(t) t.remove();
      if(!data.cars.length){ alert('截图里读不到车的资料（要看得到车牌那一行）。\n请用比较清楚的截图，或者直接 Import Excel。'); return; }
      ciFill(data);
      /* 原本的截图放进第一页的 Photos，方便对照 */
      try{ const s1 = container.querySelector('.sheet:not(.fixed-page)'); if(s1) addPhotos([file], s1.querySelector('.photo-area')); }catch(e){}
      const ck = ocrCheck(rows, data), sumTx = 'LOAN ' + ciMoney(ck.sum.loan) + '\nCB ' + ciMoney(ck.sum.cb) + '\nMONTHLY ' + ciMoney(ck.sum.mthly);
      setTimeout(() => alert(ck.bad.length ? '⚠⚠ 数目对不上截图的总数！请一部一部检查 ⚠⚠\n\n截图的总数：' + ck.bad.map(ciMoney).join('、') + '（读到的加起来对不上）\n\n读到 ' + data.cars.length + ' 部车，加起来：\n' + sumTx
        : ck.ok.length ? '✅ 读到 ' + data.cars.length + ' 部车，跟截图的总数对得上（' + ck.ok.map(ciMoney).join('、') + '）\n\n' + sumTx + '\n\n车牌 / Financing / Tenure 没有总数可以核对，请看一眼。'
        : '✓ 读到 ' + data.cars.length + ' 部车。\n截图下面没有总数，没办法自动核对 — 请对照截图检查数目。\n\n' + sumTx), 300);
    }catch(e){ const t = document.getElementById('ocrToast'); if(t) t.remove(); alert('读不到这张截图（可能是网络问题，读字工具下载不到）。请再试一次。'); }
  }
  function ocrOpen(){
    if(document.getElementById('ocrModal')) return;
    const m = document.createElement('div'); m.id = 'ocrModal';
    m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999;text-transform:none';
    m.innerHTML = '<div style="background:#fff;border-radius:12px;max-width:420px;width:90%;padding:22px;text-align:center;font-family:inherit;box-shadow:0 10px 40px rgba(0,0,0,.3)">'
      + '<div style="font-size:17px;font-weight:800;color:#5b21b6;margin-bottom:10px">📷 Import 截图</div>'
      + '<div style="font-size:13.5px;color:#334155;line-height:1.6;margin-bottom:14px">Copy 别人 send 的截图，在这里按 <b>Ctrl+V</b><br>或者把 JPG 拖进来 / 选文件</div>'
      + '<button id="ocrPick" style="background:#7c3aed;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-weight:700;cursor:pointer">选 JPG / PNG 文件</button> '
      + '<button id="ocrClose" style="background:#fff;color:#64748b;border:1px solid #cbd5e1;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer">取消</button>'
      + '<input type="file" id="ocrFile" accept="image/*" style="display:none"></div>';
    document.body.appendChild(m);
    const fi = m.querySelector('#ocrFile');
    m.querySelector('#ocrPick').onclick = () => fi.click();
    fi.onchange = () => { if(fi.files[0]) ocrImport(fi.files[0]); };
    m.querySelector('#ocrClose').onclick = () => m.remove();
    m.onclick = e => { if(e.target === m) m.remove(); };
    m.ondragover = e => e.preventDefault();
    m.ondrop = e => { e.preventDefault(); const f = [...(e.dataTransfer.files || [])].find(x => (x.type || '').startsWith('image/')); if(f) ocrImport(f); };
  }
  /* 开着 📷 窗口时按 Ctrl+V → 读截图（不放进 Photos） */
  document.addEventListener('paste', e => {
    if(!document.getElementById('ocrModal')) return;
    const it = e.clipboardData && [...e.clipboardData.items].find(i => i.kind === 'file' && i.type.startsWith('image/'));
    if(!it) return; e.preventDefault(); e.stopImmediatePropagation(); ocrImport(it.getAsFile());
  }, true);
  addSheet();      // first quotation page
  addFixedPage();  // cashback breakdown, fixed at the bottom
  window.__ready = true;
</script>
