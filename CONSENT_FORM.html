<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTOS 同意书表单</title>
<style>
  :root{--ink:#1a2330;--muted:#6b7688;--line:#d5dbe4;--accent:#c8102e;--accent-d:#a50d26;
    --bg:#eef1f5;--card:#fff;--hi:#fdecef;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.5;}
  .wrap{max-width:900px;margin:0 auto;padding:24px 18px 60px;}
  h1{font-size:20px;margin:0 0 4px;color:var(--accent-d);}
  .sub{color:var(--muted);font-size:13px;margin-bottom:22px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;
    margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .sec{font-weight:700;font-size:14px;color:var(--accent-d);margin:0 0 14px;
    padding-bottom:8px;border-bottom:1px solid var(--line);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
  @media(max-width:680px){.grid{grid-template-columns:1fr;}}
  .f{display:flex;flex-direction:column;gap:5px;}
  .f.wide{grid-column:1/-1;}
  .f label{font-size:12px;color:var(--muted);}
  .f input,.f textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);
    border-radius:8px;background:#fbfdff;color:var(--ink);}
  .f input:focus,.f textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--hi);}
  .actions{display:flex;gap:12px;flex-wrap:wrap;position:sticky;bottom:0;
    background:linear-gradient(transparent,var(--bg) 40%);padding:14px 0 4px;}
  .btn{font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;border:none;border-radius:9px;
    padding:12px 22px;background:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(200,16,46,.25);}
  .btn:hover{background:var(--accent-d);}
  .btn.g{background:#fff;color:var(--accent-d);border:1px solid var(--accent);box-shadow:none;}
  .pastezone{margin-top:6px;border:2px dashed var(--line);border-radius:8px;padding:14px;
    text-align:center;color:var(--muted);font-size:12px;cursor:pointer;background:#fbfdff;}
  .pastezone:focus,.pastezone.hot{outline:none;border-color:var(--accent);background:var(--hi);color:var(--accent-d);}
  .msg{font-size:13px;color:#2e9e6b;align-self:center;}

  /* ===== FORM DOCUMENT ===== */
  #out{margin-top:26px;}
  .doc{background:#fff;color:#000;max-width:800px;margin:0 auto;padding:40px 46px 54px;
    font-family:"Times New Roman",Times,serif;font-size:12.5px;line-height:1.5;
    box-shadow:0 4px 24px rgba(0,0,0,.12);border:1px solid #ddd;}
  .doc .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
  .doc .top .date{font-weight:bold;}
  .icpage{margin-bottom:26px;}
  .ic-name{font-size:13px;margin:8px 0 20px;}
  .ic-wrap{display:flex;flex-direction:column;gap:26px;align-items:center;margin-top:10px;}
  .ic-card{width:86%;border:1px solid #bbb;border-radius:8px;padding:10px;display:flex;
    align-items:center;justify-content:center;min-height:210px;background:#fafafa;}
  .ic-card img{max-width:100%;max-height:300px;object-fit:contain;border-radius:6px;}
  .ic-card .icph{color:#aaa;font-size:14px;text-align:center;line-height:1.6;}
  .doc .top .ver{font-size:10px;color:#333;text-align:right;}
  .doc .to{margin:14px 0 10px;}
  .doc .to .tocap{font-style:italic;font-size:11px;color:#555;margin:4px 0 2px;}
  .doc .to .box{border:1px solid #333;min-height:120px;padding:8px 10px;}
  .doc .to .box .toimg{height:104px;object-fit:contain;display:block;}
  .doc h2{font-size:14px;text-align:center;margin:16px 0;text-decoration:underline;}
  .doc p{margin:9px 0;text-align:justify;}
  .doc .chk{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;margin:8px 0 8px 6px;}
  .doc .chk div::before{content:"\2713  ";font-weight:bold;}
  .doc .full{margin:6px 0 6px 6px;}
  .doc .full::before{content:"\2713  ";font-weight:bold;}
  .signgrid{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:24px;}
  .signblk .h{font-weight:bold;margin-bottom:6px;}
  .signblk .sigimg{height:56px;margin:4px 0;}
  .signblk .sigimg img{height:100%;object-fit:contain;}
  .signblk .sp{height:56px;border-bottom:0;}
  .signblk .kv{margin:3px 0;}
  .signblk .kv b{font-weight:bold;}
  .stamp{min-height:30px;}

  @media print{
    body{background:#fff;}
    .wrap>*:not(#out){display:none;}
    .wrap{padding:0;max-width:100%;}
    #out{margin:0;}
    .doc{box-shadow:none;border:none;max-width:100%;padding:16px 24px;}
    .icpage{page-break-after:always;}
    @page{margin:14mm;size:A4;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>CTOS 同意书 (Consent Authorisation) 表单</h1>
  <div class="sub">填写资料 + 上传签名 → 自动带入表格 → 保存 PDF / 打印</div>

  <div class="card">
    <div class="sec">填写资料</div>
    <div class="grid">
      <div class="f"><label>日期 Date（默认今天，可改）</label><input id="date" value=""></div>
      <div class="f"><label>姓名 Name</label><input id="name" value=""></div>
      <div class="f"><label>身份证 IC Number</label><input id="ic" value=""></div>
      <div class="f"><label>职位 Designation</label><input id="desig" value=""></div>
      <div class="f"><label>电话 Mobile Number</label><input id="mobile" value=""></div>
      <div class="f wide"><label>签名 Signature（三选一：上传 / 粘贴 / 手绘）</label>
        <input id="sign" type="file" accept="image/*" onchange="setSign(event)">
        <div id="pasteSign" class="pastezone" tabindex="0">点这里，然后按 Ctrl+V 粘贴签名图片</div>
        <div style="margin-top:8px">
          <div style="font-size:12px;color:var(--muted);margin-bottom:4px">或在下面手绘签名：</div>
          <canvas id="sigpad" width="480" height="150" style="border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none;max-width:100%;cursor:crosshair"></canvas>
          <div style="display:flex;gap:8px;margin-top:6px">
            <button type="button" class="btn g" style="padding:5px 12px;font-size:12px" onclick="useDrawnSign()">✓ 用这个手绘签名</button>
            <button type="button" class="btn g" style="padding:5px 12px;font-size:12px" onclick="clearSigpad()">清除</button>
          </div>
        </div>
      </div>
      <div class="f"><label>身份证正面 IC Front（上传或粘贴照片）</label><input id="icFront" type="file" accept="image/*" onchange="setIcFront(event)">
        <div id="pasteFront" class="pastezone" tabindex="0">点这里，然后按 Ctrl+V 粘贴正面照片</div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:4px">
          <button type="button" class="btn g" style="padding:5px 10px;font-size:12px" onclick="rotateIc('front')">↻ 旋转正面 90°</button>
        </div></div>
      <div class="f"><label>身份证背面 IC Back（上传或粘贴照片）</label><input id="icBack" type="file" accept="image/*" onchange="setIcBack(event)">
        <div id="pasteBack" class="pastezone" tabindex="0">点这里，然后按 Ctrl+V 粘贴背面照片</div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:4px">
          <button type="button" class="btn g" style="padding:5px 10px;font-size:12px" onclick="rotateIc('back')">↻ 旋转背面 90°</button>
        </div></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn" onclick="generate()">生成表格</button>
    <button class="btn g" onclick="window.print()">保存为 PDF / 打印</button>
    <button class="btn g" onclick="clearRecord()">清除记录（姓名/IC/电话）</button>
    <span class="msg" id="msg"></span>
  </div>

  <div id="out"></div>
</div>

const V=id=>document.getElementById(id).value.trim();
let signData='';
let icFrontData='';
let icBackData='';
function clearRecord(){
  if(!confirm('确定清除姓名、IC 号、电话号码？')) return;
  ['name','ic','mobile'].forEach(id=>{const el=document.getElementById(id); if(el) el.value='';});
  generate();
}
function setSign(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{signData=r.result;generate();};r.readAsDataURL(f);}

// ---- signature drawing pad ----
let sigDrawn=false;
function initSigpad(){
  const c=document.getElementById('sigpad'); if(!c)return;
  const ctx=c.getContext('2d');
  ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#111';
  let drawing=false,last=null;
  function pos(e){
    const r=c.getBoundingClientRect();
    const sx=c.width/r.width, sy=c.height/r.height;
    const p=(e.touches&&e.touches[0])||e;
    return {x:(p.clientX-r.left)*sx, y:(p.clientY-r.top)*sy};
  }
  function start(e){drawing=true;last=pos(e);e.preventDefault();}
  function move(e){ if(!drawing)return; const p=pos(e);
    ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();
    last=p;sigDrawn=true;e.preventDefault(); }
  function end(){drawing=false;}
  c.addEventListener('mousedown',start); c.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
  c.addEventListener('touchstart',start,{passive:false});
  c.addEventListener('touchmove',move,{passive:false});
  c.addEventListener('touchend',end);
}
function clearSigpad(){
  const c=document.getElementById('sigpad'); if(!c)return;
  c.getContext('2d').clearRect(0,0,c.width,c.height); sigDrawn=false;
}
function useDrawnSign(){
  const c=document.getElementById('sigpad'); if(!c)return;
  if(!sigDrawn){ alert('请先在方框里手绘签名'); return; }
  signData=c.toDataURL('image/png'); generate();
}
function setIcFront(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{icFrontData=r.result;generate();};
  r.readAsDataURL(f);
}
function setIcBack(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{icBackData=r.result;generate();};r.readAsDataURL(f);}

// rotate a dataURL by given degrees, returns Promise<dataURL>
function rotateDataUrl(dataUrl,deg){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      const r=(deg%360+360)%360;
      if(r===90||r===270){c.width=img.height;c.height=img.width;}
      else{c.width=img.width;c.height=img.height;}
      const ctx=c.getContext('2d');
      ctx.translate(c.width/2,c.height/2);
      ctx.rotate(r*Math.PI/180);
      ctx.drawImage(img,-img.width/2,-img.height/2);
      res(c.toDataURL('image/jpeg',0.92));
    };
    img.onerror=rej;
    img.src=dataUrl;
  });
}
async function rotateIc(which){
  if(which==='front'){ if(!icFrontData)return; icFrontData=await rotateDataUrl(icFrontData,90); }
  else{ if(!icBackData)return; icBackData=await rotateDataUrl(icBackData,90); }
  generate();
}

  const html=`<div class="doc icpage">

    <p>By this consent, I/we understand and agree that:</p>
    <p>i) You may conduct credit/trade check including CCRIS checks on me/us and when consent has been given individually, on our directors, shareholders, guarantors, etc. with CTOS at any time for as long as I/we have a trade relationship with you or where any dues remain unpaid and outstanding with you, for any one or more of the following purposes:</p>

  document.getElementById('out').innerHTML=html;
  const m=document.getElementById('msg');m.textContent='\u5df2\u751f\u6210\uff0c\u53ef\u4fdd\u5b58 PDF';setTimeout(()=>m.textContent='',2500);

(function(){
  const d=new Date();
  const dd=String(d.getDate()).padStart(2,'0');
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const yyyy=d.getFullYear();
  const el=document.getElementById('date');
  if(el && !el.value.trim()) el.value=dd+'/'+mm+'/'+yyyy;
})();

// ---- paste image support ----
function imgFromClipboard(e){
  const items=(e.clipboardData||window.clipboardData||{}).items||[];
  for(const it of items){
    if(it.type && it.type.indexOf('image')===0){
      const blob=it.getAsFile();
      if(blob) return blob;
    }
  }
  return null;
}
function handlePaste(which,e){
  const blob=imgFromClipboard(e);
  if(!blob)return false;
  e.preventDefault();
  const r=new FileReader();
  r.onload=()=>{
    if(which==='front'){ icFrontData=r.result; generate(); }
    else{ icBackData=r.result; generate(); }
  };
  r.readAsDataURL(blob);
  return true;
}
['front','back'].forEach(w=>{
  const z=document.getElementById(w==='front'?'pasteFront':'pasteBack');
  if(!z)return;
  z.addEventListener('paste',e=>handlePaste(w,e));
  z.addEventListener('focus',()=>z.classList.add('hot'));
  z.addEventListener('blur',()=>z.classList.remove('hot'));
  z.addEventListener('click',()=>z.focus());
});
// signature paste zone
(function(){
  const z=document.getElementById('pasteSign');
  if(!z)return;
  z.addEventListener('paste',e=>{
    const blob=imgFromClipboard(e);
    if(!blob)return;
    e.preventDefault();
    const r=new FileReader();
    r.onload=()=>{signData=r.result;generate();};
    r.readAsDataURL(blob);
  });
  z.addEventListener('focus',()=>z.classList.add('hot'));
  z.addEventListener('blur',()=>z.classList.remove('hot'));
  z.addEventListener('click',()=>z.focus());
})();
initSigpad();
// also catch paste anywhere → goes to front by default
document.addEventListener('paste',e=>{
  const active=document.activeElement;
  if(active && (active.id==='pasteFront'||active.id==='pasteBack'||active.id==='pasteSign')) return; // handled above
  if(active && (active.tagName==='INPUT'||active.tagName==='TEXTAREA')) return; // let text paste work
  handlePaste('front',e);
});

generate();

/* 给 CRM 存档用：签名 + IC 正反面一起存；打开存档后自动重新生成表格 */
window.__crmGetExtra = function(){ return { sign: signData, icFront: icFrontData, icBack: icBackData }; };
window.__crmSetExtra = function(o){ o = o || {}; signData = o.sign || ''; icFrontData = o.icFront || ''; icBackData = o.icBack || ''; generate(); };
window.__crmAfterLoad = function(){ generate(); };
